<!-- title: pharmacy-home -->
<div id="dh">
<script>
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    return _f(url, opts).then(function(r){
      if(!r.ok && String(url).indexOf('/api/method/')!==-1){
        r.clone().json().then(function(j){
          var t='';
          try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message;}catch(e){}
          if(/invalid request|not logged in/i.test(t)||r.status===403)
            window.location.replace('/login?redirect-to='+encodeURIComponent(location.pathname+location.search));
        }).catch(function(){});
      }
      return r;
    });
  };
})();
</script>
<style>
#dh{
  --ink:#11281e;
  --mute:#546a5f;
  --line:#cfe0d7;
  --pri:#125c3a;
  --pri-dark:#0d3d27;
  --bg:#f4f9f6;
  --ok:#125c3a;
  --err:#c0392b;
  --gold:#f1c40f;
  --gold-bg:#fffbe6;
  --gold-border:#f7dc6f;
  --shadow:0 8px 30px rgba(18,92,58,0.08);
  --shadow-sm:0 2px 10px rgba(18,92,58,0.06);
  max-width:1100px;
  margin:0 auto;
  padding:12px 14px 100px;
  color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  box-sizing:border-box;
}
#dh *{box-sizing:border-box}

#dh .hd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:18px 20px;
  background:linear-gradient(135deg,#0d3d27 0%,#125c3a 100%);
  border-radius:14px;
  color:#fff;
  box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}
#dh h1{font-size:1.4rem;font-weight:900;margin:0;color:#fff}
#dh h2{font-size:1.1rem;font-weight:800;color:var(--pri);margin:24px 0 10px}
#dh .sub{margin:2px 0 0;color:#d8efe4;font-size:.84rem}
#dh .rf{
  border:none;
  background:linear-gradient(135deg,#f1c40f,#d4ac0d);
  color:#2b1d00;
  border-radius:999px;
  padding:8px 16px;
  font:inherit;
  font-weight:800;
  font-size:.88rem;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(241,196,15,0.3);
  transition:transform .15s ease;
}
#dh .rf:hover{transform:translateY(-1px)}

#dh .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
#dh .chips::-webkit-scrollbar{display:none}
#dh .chip{
  flex:none;
  padding:10px 18px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--mute);
  font:inherit;
  font-weight:700;
  font-size:.92rem;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:all .15s ease;
}
#dh .chip[aria-pressed=true]{
  background:var(--pri);
  border-color:var(--pri);
  color:#fff;
  box-shadow:0 3px 10px rgba(18,92,58,0.25);
}

#dh .cust{
  display:flex;
  gap:10px;
  align-items:end;
  flex-wrap:wrap;
  margin:0 0 16px;
  background:#fff;
  padding:14px;
  border-radius:12px;
  border:1.5px solid var(--line);
}
#dh .cust label{display:block;font-size:.78rem;font-weight:700;color:var(--mute);margin-bottom:3px}
#dh input{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
#dh input:focus{outline:3px solid #8cc9b5;border-color:var(--pri)}

#dh .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#dh a.tile{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:16px 18px;
  border-radius:14px;
  background:#fff;
  color:var(--ink);
  text-decoration:none;
  box-shadow:var(--shadow-sm);
  border:1.5px solid var(--line);
  min-height:82px;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
#dh a.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--pri)}
#dh a.tile b{display:block;font-size:1.3rem;font-weight:900;line-height:1.2;color:var(--pri)}
#dh a.tile span.l{display:block;font-size:.95rem;font-weight:700}
#dh a.tile small{display:block;color:var(--mute);font-size:.78rem;margin-top:2px}
#dh a.tile .ch{flex:none;color:var(--pri);font-size:1.6rem;line-height:1}
#dh a.tile.good{background:#f3faf6;border-color:#a5d6be}
#dh a.tile.bad{background:#fdf4f3;border-color:#f3b7ad}
#dh a.tile.neg b{color:var(--err)}

#dh .sbox{position:relative;margin-bottom:8px}
#dh .sbox input{
  width:100%;
  padding:14px 50px 14px 16px;
  font-size:1rem;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:#fff;
  box-shadow:var(--shadow-sm);
}
#dh .sbox svg{position:absolute;right:16px;top:50%;margin-top:-13px;stroke:var(--pri)}
#dh .res{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  margin-top:8px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:#fff;
  box-shadow:var(--shadow-sm);
}
#dh .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:800;font-size:.8rem;color:#fff;background:var(--ok)}
#dh .badge.out{background:var(--err)}

#dh .qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
#dh .qa a{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:16px 8px;
  border-radius:14px;
  background:#fff;
  color:var(--ink);
  text-decoration:none;
  font-size:.88rem;
  font-weight:700;
  text-align:center;
  box-shadow:var(--shadow-sm);
  border:1.5px solid var(--line);
  transition:all .15s ease;
}
#dh .qa a:hover{transform:translateY(-2px);border-color:var(--pri);color:var(--pri)}
#dh .qa svg{width:32px;height:32px;color:var(--pri)}

#dh .note{padding:12px 14px;margin:0 0 14px;border-radius:8px;background:#fdf2f2;border-left:4px solid var(--err);color:var(--err)}

/* Bottom Nav */
#dh nav.bn{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#fff;
  border-top:1.5px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 16px rgba(0,0,0,0.06);
}
#dh nav.bn a,#dh nav.bn button{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  border:0;
  background:none;
  color:var(--mute);
  font:inherit;
  font-size:.82rem;
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  padding:2px 0;
}
#dh nav.bn svg{width:24px;height:24px}
#dh nav.bn .on{color:var(--pri);font-weight:800}

#dh .sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:64px;
  z-index:25;
  margin:0 auto;
  max-width:520px;
  padding:10px 16px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:16px 16px 0 0;
  box-shadow:0 -6px 24px rgba(18,92,58,0.18);
}
#dh .sheet a{display:block;padding:14px 6px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
#dh .sheet a:first-child{border-top:0}
#dh [hidden]{display:none!important}

@media(min-width:820px){
  #dh .grid{grid-template-columns:repeat(4,1fr)}
  #dh .qa{max-width:760px;grid-template-columns:repeat(5,1fr)}
}
@media(max-width:540px){
  #dh .grid{grid-template-columns:1fr}
}
</style>
<div class="hd"><div><h1 id="co">💊 Pharmacy</h1><p class="sub" id="upd">Loading...</p></div><button type="button" class="rf" id="rf">&#x21bb; Refresh</button></div>
<div id="err" class="note" hidden></div>
<div class="chips" id="chips">
<button type="button" class="chip" data-p="today" aria-pressed="true">Today</button>
<button type="button" class="chip" data-p="yesterday" aria-pressed="false">Yesterday</button>
<button type="button" class="chip" data-p="7" aria-pressed="false">Last 7 days</button>
<button type="button" class="chip" data-p="30" aria-pressed="false">Last 30 days</button>
<button type="button" class="chip" data-p="month" aria-pressed="false">This month</button>
<button type="button" class="chip" data-p="lastmonth" aria-pressed="false">Last month</button>
<button type="button" class="chip" data-p="custom" aria-pressed="false">Custom</button>
</div>
<div class="cust" id="cust" hidden>
<div><label for="d1">From</label><input type="date" id="d1"></div>
<div><label for="d2">To</label><input type="date" id="d2"></div>

</div>

<nav class="bn">

<script>
(function(){
var $=function(s){return document.querySelector('#dh '+s)};
var cur='today',timer;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function inr(v){v=Number(v)||0;return (v<0?'-':'')+'\u20B9'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function range(p){
  var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(p==='today')return [t,t];
  if(p==='yesterday'){var y=addDays(t,-1);return [y,y]}
  if(p==='7')return [addDays(t,-6),t];
  if(p==='30')return [addDays(t,-29),t];
  if(p==='month')return [new Date(t.getFullYear(),t.getMonth(),1),t];
  if(p==='lastmonth')return [new Date(t.getFullYear(),t.getMonth()-1,1),new Date(t.getFullYear(),t.getMonth(),0)];
  return [new Date($('#d1').value+'T00:00:00'),new Date($('#d2').value+'T00:00:00')]
}
function call(method,params){
  return fetch('/api/method/'+method+'?'+new URLSearchParams(params||{}),{headers:{Accept:'application/json'}}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        throw new Error(t)}
      return j.message})})
}
var LINKS={stock:'/pharmacy#list',sales:'/app/sales-invoice',purchase:'/app/purchase-invoice',pl:'/app/query-report/Profit%20and%20Loss%20Statement',gl:'/app/query-report/General%20Ledger',ar:'/app/query-report/Accounts%20Receivable',ap:'/app/query-report/Accounts%20Payable'};
function tile(l,v,href,cls,sub){
  return '<a class="tile'+(cls?' '+cls:'')+'" href="'+href+'"><div><b>'+v+'</b><span class="l">'+l+'</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><span class="ch">&#8250;</span></a>'
}
function render(d){
  var T=[];
  T.push(tile('Total Stock Value',inr(d.stock_value),LINKS.stock));
  T.push(tile('Expired Stock Value',inr(d.expired),LINKS.stock,d.expired>0?'bad':''));
  T.push(tile('Net Sales Amt',inr(d.sales),LINKS.sales,'',d.bills+' bill'+(d.bills===1?'':'s')));
  T.push(tile('Net Purchase Amt',inr(d.purchase),LINKS.purchase));
  T.push(tile('Expiring in 90 Days',inr(d.expiring),LINKS.stock));
  T.push(tile('Cash+Bank Balance',inr(d.cash_bank),LINKS.gl));
  T.push(tile('Net Profit Amt',inr(d.profit),LINKS.pl,d.profit<0?'neg':'good','After cost and expenses'));
  T.push(tile('Total Expenses',inr(d.expenses),LINKS.pl));
  T.push(tile('Overall You\u2019ll Receive',inr(d.receive),LINKS.ar));
  T.push(tile('Overall You\u2019ll Pay',inr(d.pay),LINKS.ap,d.pay>0?'bad':''));
  $('#tiles').innerHTML=T.join('');
  if(d.company)$('#co').textContent=d.company;
  var n=new Date();$('#upd').textContent='Updated '+n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})
}
function load(){
  var r=range(cur);
  if(isNaN(r[0])||isNaN(r[1])||r[0]>r[1]){$('#err').textContent='Choose a valid date range.';$('#err').hidden=false;return}
  $('#err').hidden=true;$('#upd').textContent='Loading...';
  call('ph_dash',{from:iso(r[0]),to:iso(r[1])}).then(render).catch(function(e){$('#err').textContent=e.message;$('#err').hidden=false;$('#upd').textContent=''})
}
$('#chips').onclick=function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  cur=b.dataset.p;
  document.querySelectorAll('#dh .chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
  $('#cust').hidden=cur!=='custom';
  if(cur==='custom'){if(!$('#d1').value){$('#d1').value=iso(new Date());$('#d2').value=iso(new Date())}return}
  load()
};
$('#ap').onclick=load;$('#rf').onclick=load;
$('#q').oninput=function(){
  clearTimeout(timer);var v=this.value.trim();
  if(!v){$('#qr').innerHTML='';return}
  timer=setTimeout(function(){
    call('ph_products',{q:v}).then(function(r){
      $('#qr').innerHTML=r.products.length?r.products.map(function(p){var s=p.units>0;
        return '<div class="res"><b>'+esc(p.name)+'</b><span><span class="badge'+(s?'':' out')+'">'+(s?'In stock':'Out of stock')+'</span>'+(s?' <small>'+esc(p.units)+' units</small>':'')+'</span></div>'}).join(''):'<p class="sub">No matching products.</p>'
    }).catch(function(e){$('#qr').innerHTML='<p class="sub">'+esc(e.message)+'</p>'})
  },250)
};
$('#more-b').onclick=function(){$('#more').hidden=!$('#more').hidden};
document.addEventListener('click',function(e){if(!$('#more').hidden&&!e.target.closest('#more-b')&&!e.target.closest('#more'))$('#more').hidden=true});
load();
})();
</script>
</div>
