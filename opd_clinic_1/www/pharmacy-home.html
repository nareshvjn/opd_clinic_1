<!-- title: pharmacy-home -->
<div id="dh">
<script>
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    return _f(url, opts).then(function(r){
      if(!r.ok && String(url).indexOf('/api/method/')!==-1){
        r.clone().json().then(function(j){
          var t='';
          try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message;}catch(e){}
          if(/invalid request|not logged in/i.test(t)||r.status===403)
            window.location.replace('/login?redirect-to='+encodeURIComponent(location.pathname+location.search));
        }).catch(function(){});
      }
      return r;
    });
  };
})();
</script>
<style>
#dh{--ink:#2b1a3a;--mute:#6b6577;--line:#e7e2ee;--pri:#6a0f6e;--bg:#f6f3f9;--ok:#1d7a5f;--err:#b3261e;max-width:1100px;margin:0 auto;padding:10px 12px 96px;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#dh *{box-sizing:border-box}
#dh .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}
#dh h1{font-size:1.35rem;margin:0}
#dh h2{font-size:1.05rem;margin:18px 0 8px}
#dh .sub{margin:2px 0 0;color:var(--mute);font-size:.82rem}
#dh .rf{border:1.5px solid var(--line);background:#fff;color:var(--pri);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
#dh .chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
#dh .chips::-webkit-scrollbar{display:none}
#dh .chip{flex:none;padding:12px 22px;border:0;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:1.02rem;box-shadow:0 1px 6px rgba(60,30,90,.14);cursor:pointer}
#dh .chip[aria-pressed=true]{background:#ffd3d6;color:#e6195a;font-weight:800}
#dh .cust{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:0 0 12px}
#dh .cust label{display:block;font-size:.78rem;font-weight:600;color:var(--mute);margin-bottom:2px}
#dh input{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
#dh .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#dh a.tile{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:14px 12px;border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 2px 9px rgba(60,30,90,.12);border:1.5px solid transparent;min-height:78px}
#dh a.tile b{display:block;font-size:1.2rem;line-height:1.2}
#dh a.tile span.l{display:block;font-size:.95rem}
#dh a.tile small{display:block;color:var(--mute);font-size:.78rem}
#dh a.tile .ch{flex:none;color:var(--pri);font-size:1.7rem;line-height:1}
#dh a.tile.good{background:#f4fcf7;border-color:#8fd3ae}
#dh a.tile.bad{background:#fff3ee;border-color:#f3b7ad}
#dh a.tile.neg b{color:var(--err)}
#dh .sbox{position:relative}
#dh .sbox input{width:100%;padding:15px 52px 15px 16px;font-size:1.05rem;border-radius:12px}
#dh .sbox svg{position:absolute;right:16px;top:50%;margin-top:-13px}
#dh .res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
#dh .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;font-size:.8rem;color:#fff;background:var(--ok)}
#dh .badge.out{background:var(--err)}
#dh .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#dh .qa a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-size:.85rem;text-align:center;box-shadow:0 2px 9px rgba(60,30,90,.12)}
#dh .qa svg{width:34px;height:34px;color:var(--pri)}
#dh .note{padding:11px 14px;margin:0 0 12px;border-radius:8px;background:#fdf0ef;border-left:4px solid var(--err)}
#dh nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#dh nav.bn a,#dh nav.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#8d8799;font:inherit;font-size:.9rem;text-decoration:none;cursor:pointer;padding:4px 0}
#dh nav.bn svg{width:26px;height:26px}
#dh nav.bn .on{color:var(--ink);font-weight:800}
#dh .sheet{position:fixed;left:0;right:0;bottom:62px;z-index:25;margin:0 auto;max-width:520px;padding:8px 14px;background:#fff;border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(60,30,90,.2)}
#dh .sheet a{display:block;padding:13px 4px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
#dh .sheet a:first-child{border-top:0}
#dh [hidden]{display:none!important}
@media(min-width:820px){#dh .grid{grid-template-columns:repeat(4,1fr)}#dh .qa{max-width:560px}}
</style>
<div class="hd"><div><h1 id="co">Pharmacy</h1><p class="sub" id="upd">Loading...</p></div><button type="button" class="rf" id="rf">Refresh</button></div>
<div id="err" class="note" hidden></div>
<div class="chips" id="chips">
<button type="button" class="chip" data-p="today" aria-pressed="true">Today</button>
<button type="button" class="chip" data-p="yesterday" aria-pressed="false">Yesterday</button>
<button type="button" class="chip" data-p="7" aria-pressed="false">Last 7 days</button>
<button type="button" class="chip" data-p="30" aria-pressed="false">Last 30 days</button>
<button type="button" class="chip" data-p="month" aria-pressed="false">This month</button>
<button type="button" class="chip" data-p="lastmonth" aria-pressed="false">Last month</button>
<button type="button" class="chip" data-p="custom" aria-pressed="false">Custom</button>
</div>
<div class="cust" id="cust" hidden>
<div><label for="d1">From</label><input type="date" id="d1"></div>
<div><label for="d2">To</label><input type="date" id="d2"></div>
<button type="button" class="rf" id="ap">Apply</button>
</div>
<div class="grid" id="tiles"></div>
<h2>Search products</h2>
<div class="sbox"><input id="q" autocomplete="off" placeholder="Search Products"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2b1a3a" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div>

<div class="qa">

<a href="/pharmacy#purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h3l2.5 11h9.5l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Purchase</a>

<a href="/pharmacy#list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Stock list</a>
</div>
<nav class="bn">
<a href="/pharmacy-home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</a>
<a href="/pharmacy#purchase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h3l2.5 11h9.5l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Purchase</a>
<a href="/pharmacy#list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Stock</a>
<a href="/pharmacy#sale"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20V10h4v10zM10 20V4h4v16zM15 20v-7h4v7z"/></svg>Sales</a>
<button type="button" id="more-b"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>More</button>
</nav>
<div class="sheet" id="more" hidden>
<a href="/pharmacy#stock">Stock entry</a>
<a href="/stock-import">Stock import</a>

<a href="/app">Open ERPNext</a>
</div>
<script>
(function(){
var $=function(s){return document.querySelector('#dh '+s)};
var cur='today',timer;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function inr(v){v=Number(v)||0;return (v<0?'-':'')+'\u20B9'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function range(p){
  var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(p==='today')return [t,t];
  if(p==='yesterday'){var y=addDays(t,-1);return [y,y]}
  if(p==='7')return [addDays(t,-6),t];
  if(p==='30')return [addDays(t,-29),t];
  if(p==='month')return [new Date(t.getFullYear(),t.getMonth(),1),t];
  if(p==='lastmonth')return [new Date(t.getFullYear(),t.getMonth()-1,1),new Date(t.getFullYear(),t.getMonth(),0)];
  return [new Date($('#d1').value+'T00:00:00'),new Date($('#d2').value+'T00:00:00')]
}
function call(method,params){
  return fetch('/api/method/'+method+'?'+new URLSearchParams(params||{}),{headers:{Accept:'application/json'}}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        throw new Error(t)}
      return j.message})})
}
var LINKS={stock:'/pharmacy#list',sales:'/app/sales-invoice',purchase:'/app/purchase-invoice',pl:'/app/query-report/Profit%20and%20Loss%20Statement',gl:'/app/query-report/General%20Ledger',ar:'/app/query-report/Accounts%20Receivable',ap:'/app/query-report/Accounts%20Payable'};
function tile(l,v,href,cls,sub){
  return '<a class="tile'+(cls?' '+cls:'')+'" href="'+href+'"><div><b>'+v+'</b><span class="l">'+l+'</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><span class="ch">&#8250;</span></a>'
}
function render(d){
  var T=[];
  T.push(tile('Total Stock Value',inr(d.stock_value),LINKS.stock));
  T.push(tile('Expired Stock Value',inr(d.expired),LINKS.stock,d.expired>0?'bad':''));
  T.push(tile('Net Sales Amt',inr(d.sales),LINKS.sales,'',d.bills+' bill'+(d.bills===1?'':'s')));
  T.push(tile('Net Purchase Amt',inr(d.purchase),LINKS.purchase));
  T.push(tile('Expiring in 90 Days',inr(d.expiring),LINKS.stock));
  T.push(tile('Cash+Bank Balance',inr(d.cash_bank),LINKS.gl));
  T.push(tile('Net Profit Amt',inr(d.profit),LINKS.pl,d.profit<0?'neg':'good','After cost and expenses'));
  T.push(tile('Total Expenses',inr(d.expenses),LINKS.pl));
  T.push(tile('Overall You\u2019ll Receive',inr(d.receive),LINKS.ar));
  T.push(tile('Overall You\u2019ll Pay',inr(d.pay),LINKS.ap,d.pay>0?'bad':''));
  $('#tiles').innerHTML=T.join('');
  if(d.company)$('#co').textContent=d.company;
  var n=new Date();$('#upd').textContent='Updated '+n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})
}
function load(){
  var r=range(cur);
  if(isNaN(r[0])||isNaN(r[1])||r[0]>r[1]){$('#err').textContent='Choose a valid date range.';$('#err').hidden=false;return}
  $('#err').hidden=true;$('#upd').textContent='Loading...';
  call('ph_dash',{from:iso(r[0]),to:iso(r[1])}).then(render).catch(function(e){$('#err').textContent=e.message;$('#err').hidden=false;$('#upd').textContent=''})
}
$('#chips').onclick=function(e){
  var b=e.target.closest('[data-p]');if(!b)return;
  cur=b.dataset.p;
  document.querySelectorAll('#dh .chip').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
  $('#cust').hidden=cur!=='custom';
  if(cur==='custom'){if(!$('#d1').value){$('#d1').value=iso(new Date());$('#d2').value=iso(new Date())}return}
  load()
};
$('#ap').onclick=load;$('#rf').onclick=load;
$('#q').oninput=function(){
  clearTimeout(timer);var v=this.value.trim();
  if(!v){$('#qr').innerHTML='';return}
  timer=setTimeout(function(){
    call('ph_products',{q:v}).then(function(r){
      $('#qr').innerHTML=r.products.length?r.products.map(function(p){var s=p.units>0;
        return '<div class="res"><b>'+esc(p.name)+'</b><span><span class="badge'+(s?'':' out')+'">'+(s?'In stock':'Out of stock')+'</span>'+(s?' <small>'+esc(p.units)+' units</small>':'')+'</span></div>'}).join(''):'<p class="sub">No matching products.</p>'
    }).catch(function(e){$('#qr').innerHTML='<p class="sub">'+esc(e.message)+'</p>'})
  },250)
};
$('#more-b').onclick=function(){$('#more').hidden=!$('#more').hidden};
document.addEventListener('click',function(e){if(!$('#more').hidden&&!e.target.closest('#more-b')&&!e.target.closest('#more'))$('#more').hidden=true});
load();
})();
</script>
</div>
