<!-- title: doctor-desk -->
<div id="dd">
<script>
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    return _f(url, opts).then(function(r){
      if(!r.ok && String(url).indexOf('/api/method/')!==-1){
        r.clone().json().then(function(j){
          var t='';
          try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message;}catch(e){}
          if(/invalid request|not logged in/i.test(t)||r.status===403)
            window.location.replace('/login?redirect-to='+encodeURIComponent(location.pathname+location.search));
        }).catch(function(){});
      }
      return r;
    });
  };
})();
</script>
<style>
#dd{
  --ink:#11281e;
  --mute:#546a5f;
  --line:#cfe0d7;
  --bg:#f4f9f6;
  --brand:#125c3a;
  --brand-dark:#0d3d27;
  --ok:#125c3a;
  --err:#c0392b;
  --now:#d97706;
  --gold:#f1c40f;
  --gold-text:#966f00;
  --gold-bg:#fffbe6;
  --shadow:0 8px 30px rgba(18,92,58,0.08);
  --shadow-sm:0 2px 10px rgba(18,92,58,0.06);
  max-width:880px;
  margin:0 auto;
  padding:12px 12px 64px;
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
}
#dd *{box-sizing:border-box}

/* Header */
#dd .top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  padding:20px 22px;
  margin-bottom:18px;
  background:linear-gradient(135deg,#0d3d27 0%,#125c3a 100%);
  border-radius:14px;
  color:#fff;
  box-shadow:var(--shadow);
}
#dd .top-header h1{
  font-size:1.45rem;
  font-weight:900;
  margin:0;
  color:#fff;
  display:flex;
  align-items:center;
  gap:8px;
}
#dd .top-header .badge-opd{
  background:linear-gradient(135deg,#f1c40f,#d4ac0d);
  color:#2b1d00;
  font-size:.74rem;
  font-weight:800;
  padding:3px 10px;
  border-radius:20px;
  letter-spacing:.05em;
  text-transform:uppercase;
}

/* Date Bar */
#dd .bar{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:14px;
  background:#fff;
  padding:10px 12px;
  border-radius:12px;
  border:1.5px solid var(--line);
  box-shadow:var(--shadow-sm);
}
#dd .bar-row{
  display:flex;
  gap:8px;
  align-items:center;
  width:100%;
}
#dd input,#dd select{
  padding:8px 12px;
  height:38px;
  border:1.5px solid var(--line);
  border-radius:8px;
  font:inherit;
  font-size:.88rem;
  color:var(--ink);
  background:#fff;
  box-sizing:border-box;
}
#dd #d-prac{
  flex:1 1 auto;
  min-width:0;
  max-width:100%;
  height:38px !important;
  font-weight:600;
  cursor:pointer;
  background-color:#fff;
}
#dd button,#dd a.btn{
  height:38px;
  padding:0 14px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  font-size:.88rem;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:all .15s ease;
  white-space:nowrap;
  box-sizing:border-box;
}
#dd button:hover,#dd a.btn:hover{background:var(--bg);border-color:var(--brand)}
#dd #refresh{background:var(--brand);color:#fff;border-color:var(--brand)}
#dd #refresh:hover{background:var(--brand-dark)}
#dd #today{background:#f4f9f6;color:var(--brand);border-color:var(--line);font-weight:700}
#dd #prev,#dd #next{flex:0 0 auto;padding:0 10px}
#dd #d-date{flex:1 1 auto;min-width:0;text-align:center;font-weight:700}
#dd input:focus,#dd select:focus,#dd button:focus-visible,#dd a:focus-visible{outline:3px solid #8cc9b5;outline-offset:1px}

/* Chips Filter */
#dd .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
#dd .chips button{
  padding:7px 14px;
  border-radius:20px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--mute);
  font-weight:700;
  font-size:.88rem;
  cursor:pointer;
  transition:all .15s ease;
}
#dd .chips button[aria-pressed=true]{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
  box-shadow:0 2px 8px rgba(18,92,58,0.25);
}

/* Appointment Cards */
#dd .a{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:6px 16px;
  padding:16px 18px;
  margin-bottom:12px;
  border:1.5px solid var(--line);
  border-left:6px solid var(--brand);
  border-radius:12px;
  background:#fff;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease;
}
#dd .a:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
#dd .a.now{border-left-color:var(--now);background:#fffbf2}
#dd .a.done{border-left-color:var(--line);opacity:.8}
#dd .t strong{display:block;font-size:1.15rem;font-weight:800;color:var(--brand)}
#dd .t span,#dd .m{color:var(--mute);font-size:.9rem}
#dd .a h3{margin:0 0 2px;font-size:1.15rem;font-weight:800;color:var(--ink)}
#dd .m{margin:4px 0}
#dd .m span{margin-right:14px}
#dd .n{margin:8px 0 0;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:.92rem;color:var(--mute)}

/* Card Actions */
#dd .x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:center}
#dd .x select.st{flex:0 1 180px;min-width:0;height:38px}
#dd .x select.pm{flex:0 1 130px;min-width:0;height:38px}
#dd .x a.go{
  background:linear-gradient(135deg,#125c3a,#0d3d27);
  border:none;
  color:#fff;
  font-weight:800;
  box-shadow:0 3px 10px rgba(18,92,58,0.25);
}
#dd .x a.go:hover{filter:brightness(1.1)}
#dd .note{padding:12px 16px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ok);font-size:.92rem}
#dd .note.bad{border-color:var(--err);background:#fdf2f2;color:var(--err)}
#dd [hidden]{display:none!important}

@media(max-width:560px){
  #dd{padding:8px 8px 50px}
  #dd .a{grid-template-columns:1fr}
  #dd .x{flex-direction:column;align-items:stretch}
  #dd .x > a,#dd .x > select.st{flex:0 0 auto;width:100%;height:38px}
  #dd .x .inv-controls{width:100%;display:flex;flex-wrap:wrap;gap:6px}
  #dd .x .inv-controls select.pm{flex:1 1 110px;width:auto;height:38px}
  #dd .x .inv-controls button.inv{flex:1 1 auto}
}
</style>

<div class="top-header">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="margin:0">🩺 Doctor Desk</h1>
    <a href="/clinic" style="background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.45);padding:5px 12px;border-radius:8px;color:#fff;text-decoration:none;font-size:.82rem;font-weight:700">🏠 Home</a>
  </div>
  <div class="badge-opd">OPD Consultations</div>
</div>

<div class="bar">
  <div class="bar-row">
    <button type="button" id="prev" aria-label="Previous day">&larr; Prev</button>
    <input type="date" id="d-date" aria-label="Date">
    <button type="button" id="next" aria-label="Next day">Next &rarr;</button>
  </div>
  <div class="bar-row">
    <button type="button" id="today">Today</button>
    <select id="d-prac" aria-label="Doctor"></select>
    <button type="button" id="refresh">&#x21bb; Refresh</button>
  </div>
</div>
<div class="chips" id="chips"></div>
<div id="past-banner" class="note" hidden></div>
<div id="err" class="note bad" role="alert" hidden></div>
<div id="list" aria-live="polite"></div>

<script>
(function(){
var $=function(s){return document.querySelector('#dd '+s)};
var csrf='',filter='',data=null;

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(t){var p=t.split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function showErr(t){var e=$('#err');e.textContent=t||'';e.hidden=!t}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        if(/invalid request/i.test(t))t='Your session expired. Refresh the page and try again.';
        throw new Error(t)}
      return j.message})})}

function load(){
  var q={date:$('#d-date').value};
  var sel=$('#d-prac');
  if(sel.dataset.ready==='1'){
    q.practitioner=sel.value;
  }
  call('desk_data',q).then(function(r){
    data=r;csrf=r.csrf||csrf;showErr('');
    if(sel.dataset.ready!=='1'){
      sel.innerHTML='';
      if(r.can_pick)sel.add(new Option('All doctors',''));
      r.practitioners.forEach(function(p){sel.add(new Option(p.practitioner_name,p.name))});
      if(r.prac){
        sel.value=r.prac;
      }
      if(!r.can_pick){sel.value=r.prac;sel.disabled=true}
      sel.dataset.ready='1';
    }
    render()
  }).catch(function(e){showErr(e.message)})}

function invUrl(n){return '/printview?doctype=Sales%20Invoice&name='+encodeURIComponent(n)+'&trigger_print=1'}
var pmOpts='';
function render(){
  var rawModes = data.modes && data.modes.length ? data.modes.slice() : ['Cash'];
  if (rawModes.indexOf('Cash') === -1) rawModes.unshift('Cash');
  pmOpts = rawModes.map(function(m){
    var sel = (m.toLowerCase() === 'cash') ? ' selected' : '';
    return '<option value="' + esc(m) + '"' + sel + '>' + esc(m) + '</option>';
  }).join('') + '<option value="Credit">Credit (pay later)</option>';
  var all=data.appointments,counts={};
  all.forEach(function(a){counts[a.status]=(counts[a.status]||0)+1});
  var c=$('#chips');c.innerHTML='';
  function chip(label,val){var b=document.createElement('button');b.type='button';
    b.textContent=label;b.setAttribute('aria-pressed',String(filter===val));
    b.onclick=function(){filter=val;render()};c.appendChild(b)}
  chip('All ('+all.length+')','');
  Object.keys(counts).forEach(function(s){chip(s+' ('+counts[s]+')',s)});

  var list=all.filter(function(a){return !filter||a.status===filter}),box=$('#list');
  var serverToday=data.today||iso(new Date());
  var selDate=$('#d-date').value;
  var isPast=!!(selDate && selDate<serverToday);
  var isAdmin=!!data.is_admin;
  var readOnlyPast=isPast && !isAdmin;
  var pb=$('#past-banner');
  if(pb){
    if(readOnlyPast){
      pb.className='note bad';
      pb.hidden=false;
      pb.textContent='Viewing past date ('+selDate+'): Read-only mode. Only admin accounts can update status or generate consultation invoices for past dates.';
    } else if(isPast && isAdmin){
      pb.className='note';
      pb.hidden=false;
      pb.textContent='Backlog mode (Admin): Consultations and invoices created from this date will be recorded on '+selDate+'.';
    } else {
      pb.hidden=true;pb.textContent='';
    }
  }
  if(!list.length){box.innerHTML='<div class="note">No appointments for this day.</div>';return}
  var n=new Date(),nowM=n.getHours()*60+n.getMinutes(),isToday=selDate===serverToday;
  box.innerHTML=list.map(function(a){
    var p=a.time.split(':'),st=+p[0]*60+ +p[1],dur=+a.duration||10;
    var cls='a'+(isToday&&nowM>=st&&nowM<st+dur?' now':'')+(/closed|checked out/i.test(a.status)?' done':'');
    var opts=data.statuses.map(function(s){return '<option'+(s===a.status?' selected':'')+'>'+esc(s)+'</option>'}).join('');
    var q='patient='+encodeURIComponent(a.patient)+'&appointment='+encodeURIComponent(a.id)+'&practitioner='+encodeURIComponent(a.practitioner);
    var closed=/closed|checked out/i.test(a.status),invBtn='';
    if(closed){
      if(a.invoice && a.invoice_docstatus === 1){
        invBtn='<a class="btn" target="_blank" rel="noopener" href="'+invUrl(a.invoice)+'">🖨️ Print invoice'+(a.invoice_total?' (₹'+a.invoice_total+')':'')+'</a>';
      } else if(readOnlyPast){
        invBtn='<span class="n" style="font-size:.82rem">Billing locked (past date)</span>';
      } else if(a.invoice && a.invoice_docstatus === 0){
        invBtn='<div class="inv-controls" style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<span style="background:#fff3cd;color:#856404;font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:6px;border:1px solid #ffeeba">Draft</span>' +
          '<div style="display:inline-flex;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px">' +
          '<span style="font-weight:700;font-size:.85rem;color:var(--brand)">₹</span>' +
          '<input type="number" class="fee-amt" value="'+(a.invoice_total||150)+'" min="0" step="10" style="width:65px;border:none;background:transparent;padding:5px 0;font-weight:700;color:var(--ink);outline:none" placeholder="150" aria-label="Consultation Fee">' +
          '</div>' +
          '<select class="pm" aria-label="Payment mode">'+pmOpts+'</select>' +
          '<button type="button" class="btn inv" data-id="'+esc(a.id)+'">Submit & Print</button>' +
          '<a class="btn" target="_blank" rel="noopener" href="'+invUrl(a.invoice)+'">View Draft</a>' +
          '</div>';
      } else {
        invBtn='<div class="inv-controls" style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">' +
          '<div style="display:inline-flex;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px">' +
          '<span style="font-weight:700;font-size:.85rem;color:var(--brand)">₹</span>' +
          '<input type="number" class="fee-amt" value="150" min="0" step="10" style="width:65px;border:none;background:transparent;padding:5px 0;font-weight:700;color:var(--ink);outline:none" placeholder="150" aria-label="Consultation Fee">' +
          '</div>' +
          '<select class="pm" aria-label="Payment mode">'+pmOpts+'</select>' +
          '<button type="button" class="btn inv" data-id="'+esc(a.id)+'">Create and print invoice</button>' +
          '</div>';
      }
    }
    var ptId = (a.uid && a.uid !== a.name) ? a.uid : '';
    var stDisabled = readOnlyPast ? ' disabled title="Only admin accounts can change past appointment status"' : '';
    return '<article class="'+cls+'"><div class="t"><strong>'+fmt(a.time)+'</strong><span>'+dur+' min</span></div>'+
      '<div><h3>'+esc(a.name)+(ptId ? ' <span style="font-size:.82em;font-weight:600;color:var(--ok)">('+esc(ptId)+')</span>' : '')+'</h3><p class="m"><span>Age '+(a.age==null?'not recorded':esc(a.age))+'</span>'+
      (a.sex?'<span>'+esc(a.sex)+'</span>':'')+'<span>Mobile '+(a.mobile?esc(a.mobile):'not on file')+'</span></p>'+
      '<p class="m">'+esc(a.type)+(data.can_pick?' with '+esc(a.practitioner_name):'')+' </p>'+
      (a.notes?'<p class="n">'+esc(a.notes)+'</p>':'')+' </div>'+
      '<div class="x"><select class="st"'+stDisabled+' data-id="'+esc(a.id)+'" aria-label="Status for '+esc(a.name)+'">'+opts+'</select>'+
      '<a class="btn" href="/vitals?'+q+'" title="Record or view vitals">'+(readOnlyPast?'View Vitals':'Vitals')+(a.has_vitals?' \u2713':'')+'</a>'+
      '<a class="btn go" href="/consultation?'+q+'">'+(readOnlyPast?'View Consultation':((closed || a.has_encounter)?'Open Consultation':'Start Consultation'))+'</a>'+invBtn+
      '<a class="btn" target="_blank" rel="noopener" href="/app/patient/'+encodeURIComponent(a.patient)+'">Patient record</a></div></article>'
  }).join('')}

$('#list').onclick=function(ev){
  var b=ev.target.closest('button.inv');if(!b)return;
  var card=b.closest('.inv-controls')||b.parentNode;
  var feeInput=card.querySelector('.fee-amt');
  var fee=feeInput?feeInput.value.trim():'150';
  var mode=card.querySelector('select.pm').value;
  var w=window.open('','_blank');
  b.disabled=true;showErr('');
  call('desk_invoice',{appointment:b.dataset.id,mode:mode,fee:fee},true).then(function(r){
    if(w)w.location.href=invUrl(r.invoice);else window.open(invUrl(r.invoice),'_blank');
    if(r.note)showErr(r.note);
    load()
  }).catch(function(e){if(w)w.close();showErr(e.message);b.disabled=false})};
$('#list').onchange=function(ev){
  var s=ev.target;if(!s.classList.contains('st'))return;
  s.disabled=true;
  call('desk_set_status',{appointment:s.dataset.id,status:s.value},true)
    .then(function(){showErr('');load()})
    .catch(function(e){showErr(e.message);load()})};
function shift(n){var d=new Date($('#d-date').value+'T12:00:00');d.setDate(d.getDate()+n);$('#d-date').value=iso(d);load()}
$('#prev').onclick=function(){shift(-1)};
$('#next').onclick=function(){shift(1)};
$('#today').onclick=function(){$('#d-date').value=iso(new Date());load()};
$('#refresh').onclick=load;
$('#d-date').onchange=load;
$('#d-prac').onchange=load;
$('#d-date').value=iso(new Date());
load();
setInterval(function(){if(!document.hidden&&document.activeElement.tagName!=='SELECT')load()},60000);
})();
</script>

</div>
