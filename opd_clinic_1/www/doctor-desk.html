<!-- title: doctor-desk -->
<div id="dd">
<script>
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    return _f(url, opts).then(function(r){
      if(!r.ok && String(url).indexOf('/api/method/')!==-1){
        r.clone().json().then(function(j){
          var t='';
          try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message;}catch(e){}
          if(/invalid request|not logged in/i.test(t)||r.status===403)
            window.location.replace('/login?redirect-to='+encodeURIComponent(location.pathname+location.search));
        }).catch(function(){});
      }
      return r;
    });
  };
})();
</script>
<style>
#dd{--ink:#16324a;--mute:#5d7184;--line:#c9d6d0;--bg:#f3f8f5;--ok:#1d7a5f;--err:#b3261e;--now:#c47f17;max-width:780px;margin:0 auto;padding:16px 4px 48px;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#dd *{box-sizing:border-box}
#dd h1{font-size:1.7rem;margin:0 0 12px;letter-spacing:-.01em}
#dd .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#dd input,#dd select{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
#dd .bar select{flex:1 1 200px;min-width:0}
#dd button,#dd a.btn{padding:10px 14px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
#dd input:focus,#dd select:focus,#dd button:focus-visible,#dd a:focus-visible{outline:3px solid #8cc9b5;outline-offset:1px}
#dd .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
#dd .chips button{padding:6px 12px;border-color:var(--line);font-weight:500}
#dd .chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
#dd .a{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;padding:14px;margin-bottom:10px;border:1.5px solid var(--line);border-left:6px solid var(--ink);border-radius:10px;background:#fff}
#dd .a.now{border-left-color:var(--now);background:#fff9ec}
#dd .a.done{border-left-color:var(--line);opacity:.78}
#dd .t strong{display:block;font-size:1.05rem}
#dd .t span,#dd .m{color:var(--mute);font-size:.92rem}
#dd .a h3{margin:0;font-size:1.1rem}
#dd .m{margin:2px 0}
#dd .m span{margin-right:14px}
#dd .n{margin:6px 0 0;padding:8px 10px;background:var(--bg);border-radius:6px;font-size:.95rem}
#dd .x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#dd .x select{flex:1 1 150px;min-width:0}
#dd .x select.pm{flex:0 1 130px}
#dd .x a.go{background:var(--ok);border-color:var(--ok);color:#fff}
#dd .note{padding:12px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--ok)}
#dd .note.bad{border-color:var(--err);background:#fdf0ef}
#dd [hidden]{display:none!important}
@media(max-width:480px){#dd .a{grid-template-columns:1fr}}
</style>

<h1>Doctor desk</h1>
<div class="bar">
  <button type="button" id="prev" aria-label="Previous day">Prev</button>
  <input type="date" id="d-date" aria-label="Date">
  <button type="button" id="next" aria-label="Next day">Next</button>
  <button type="button" id="today">Today</button>
  <select id="d-prac" aria-label="Doctor"></select>
  <button type="button" id="refresh">Refresh</button>
</div>
<div class="chips" id="chips"></div>
<div id="err" class="note bad" role="alert" hidden></div>
<div id="list" aria-live="polite"></div>

<script>
(function(){
var $=function(s){return document.querySelector('#dd '+s)};
var csrf='',filter='',data=null;

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(t){var p=t.split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function showErr(t){var e=$('#err');e.textContent=t||'';e.hidden=!t}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        if(/invalid request/i.test(t))t='Your session expired. Refresh the page and try again.';
        throw new Error(t)}
      return j.message})})}

function load(){
  var q={date:$('#d-date').value},pr=$('#d-prac').value;
  if(pr)q.practitioner=pr;
  call('desk_data',q).then(function(r){
    data=r;csrf=r.csrf||csrf;showErr('');
    var sel=$('#d-prac');
    if(sel.dataset.ready!=='1'){
      sel.innerHTML='';
      if(r.can_pick)sel.add(new Option('All doctors',''));
      r.practitioners.forEach(function(p){sel.add(new Option(p.practitioner_name,p.name))});
      if(!r.can_pick){sel.value=r.prac;sel.disabled=true}
      sel.dataset.ready='1'}
    render()
  }).catch(function(e){showErr(e.message)})}

function invUrl(n){return '/printview?doctype=Sales%20Invoice&name='+encodeURIComponent(n)+'&trigger_print=1'}
var pmOpts='';
function render(){
  pmOpts=(data.modes||[]).map(function(m){return '<option>'+esc(m)+'</option>'}).join('')+'<option value="Credit">Credit (pay later)</option>';
  var all=data.appointments,counts={};
  all.forEach(function(a){counts[a.status]=(counts[a.status]||0)+1});
  var c=$('#chips');c.innerHTML='';
  function chip(label,val){var b=document.createElement('button');b.type='button';
    b.textContent=label;b.setAttribute('aria-pressed',String(filter===val));
    b.onclick=function(){filter=val;render()};c.appendChild(b)}
  chip('All ('+all.length+')','');
  Object.keys(counts).forEach(function(s){chip(s+' ('+counts[s]+')',s)});

  var list=all.filter(function(a){return !filter||a.status===filter}),box=$('#list');
  if(!list.length){box.innerHTML='<div class="note">No appointments for this day.</div>';return}
  var n=new Date(),nowM=n.getHours()*60+n.getMinutes(),isToday=$('#d-date').value===iso(n);
  box.innerHTML=list.map(function(a){
    var p=a.time.split(':'),st=+p[0]*60+ +p[1],dur=+a.duration||10;
    var cls='a'+(isToday&&nowM>=st&&nowM<st+dur?' now':'')+(/closed|checked out/i.test(a.status)?' done':'');
    var opts=data.statuses.map(function(s){return '<option'+(s===a.status?' selected':'')+'>'+esc(s)+'</option>'}).join('');
    var q='patient='+encodeURIComponent(a.patient)+'&appointment='+encodeURIComponent(a.id)+'&practitioner='+encodeURIComponent(a.practitioner);
    var closed=/closed|checked out/i.test(a.status),invBtn='';
    if(closed){
      invBtn=a.invoice?'<a class="btn" target="_blank" rel="noopener" href="'+invUrl(a.invoice)+'">Print invoice</a>'
        :'<select class="pm" aria-label="Payment mode">'+pmOpts+'</select><button type="button" class="btn inv" data-id="'+esc(a.id)+'">Create and print invoice</button>'}
    return '<article class="'+cls+'"><div class="t"><strong>'+fmt(a.time)+'</strong><span>'+dur+' min</span></div>'+
      '<div><h3>'+esc(a.name)+'</h3><p class="m"><span>Age '+(a.age==null?'not recorded':esc(a.age))+'</span>'+
      (a.sex?'<span>'+esc(a.sex)+'</span>':'')+'<span>Mobile '+(a.mobile?esc(a.mobile):'not on file')+'</span></p>'+
      '<p class="m">'+esc(a.type)+(data.can_pick?' with '+esc(a.practitioner_name):'')+' </p>'+
      (a.notes?'<p class="n">'+esc(a.notes)+'</p>':'')+' </div>'+
      '<div class="x"><select class="st" data-id="'+esc(a.id)+'" aria-label="Status for '+esc(a.name)+'">'+opts+'</select>'+
      '<a class="btn go" href="/consultation?'+q+'">'+((closed || a.has_encounter)?'Open Consultation':'Start Consultation')+'</a>'+invBtn+
      '<a class="btn" target="_blank" rel="noopener" href="/app/patient/'+encodeURIComponent(a.patient)+'">Patient record</a></div></article>'
  }).join('')}

$('#list').onclick=function(ev){
  var b=ev.target.closest('button.inv');if(!b)return;
  var mode=b.parentNode.querySelector('select.pm').value,w=window.open('','_blank');
  b.disabled=true;showErr('');
  call('desk_invoice',{appointment:b.dataset.id,mode:mode},true).then(function(r){
    if(w)w.location.href=invUrl(r.invoice);else window.open(invUrl(r.invoice),'_blank');
    if(r.note)showErr(r.note);
    load()
  }).catch(function(e){if(w)w.close();showErr(e.message);b.disabled=false})};
$('#list').onchange=function(ev){
  var s=ev.target;if(!s.classList.contains('st'))return;
  s.disabled=true;
  call('desk_set_status',{appointment:s.dataset.id,status:s.value},true)
    .then(function(){showErr('');load()})
    .catch(function(e){showErr(e.message);load()})};
function shift(n){var d=new Date($('#d-date').value+'T12:00:00');d.setDate(d.getDate()+n);$('#d-date').value=iso(d);load()}
$('#prev').onclick=function(){shift(-1)};
$('#next').onclick=function(){shift(1)};
$('#today').onclick=function(){$('#d-date').value=iso(new Date());load()};
$('#refresh').onclick=load;
$('#d-date').onchange=load;
$('#d-prac').onchange=load;
$('#d-date').value=iso(new Date());
load();
setInterval(function(){if(!document.hidden&&document.activeElement.tagName!=='SELECT')load()},60000);
})();
</script>
</div>
