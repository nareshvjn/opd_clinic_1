<!-- title: Add Stock -->
<div id="as">
<script>
  function s(t){var d=document.createElement('div');d.style.cssText='padding:10px;margin:8px 0;background:#fdf0ef;color:#b3261e;border-left:4px solid #b3261e;font:14px system-ui;word-break:break-word';d.textContent=t;var p=document.getElementById('as');p.insertBefore(d,p.firstChild)}
  window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('bundle')<0&&e.filename.indexOf('website_script')<0)s('Error: '+e.message+' (line '+e.lineno+':'+e.colno+')')});
</script>
<style>
  #as *{box-sizing:border-box;margin:0;padding:0}
  #as{font:15px/1.5 system-ui,sans-serif;color:#1c1b1f;max-width:680px;margin:0 auto;padding:14px 10px 80px}
  #as .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  #as h1{font-size:1.4rem;font-weight:700}
  #as h2{font-size:1.05rem;font-weight:700;margin-bottom:10px}
  #as .card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:12px}
  #as label{display:block;font-size:.82rem;font-weight:600;color:#555;margin-top:10px;margin-bottom:3px}
  #as label:first-child{margin-top:0}
  #as input,#as select{width:100%;border:1px solid #c4c7c5;border-radius:8px;padding:9px 11px;font:15px system-ui;background:#fff;color:#1c1b1f}
  #as input:focus,#as select:focus{outline:2px solid #1a73e8;border-color:transparent}
  #as .btn{background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:10px 18px;font:600 15px system-ui;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;text-align:center}
  #as .btn:disabled{opacity:.5;cursor:default}
  #as .btn.go{background:#188038}
  #as .link{background:none;border:none;color:#1a73e8;font:15px system-ui;cursor:pointer;padding:0;text-decoration:underline}
  #as .back-link{color:#1a73e8;font-size:.9rem;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
  #as .split{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #as .hint{font-size:.82rem;color:#777;margin-top:4px}
  #as .mute{color:#777}
  #as #toast{padding:10px 14px;border-radius:8px;font-size:.9rem;margin:8px 0;background:#e6f4ea;color:#1e8e3e}
  #as #toast.bad{background:#fdf0ef;color:#b3261e}
  #as .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #as .sum{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid #eee;font-size:.92rem}
  @media(max-width:520px){
    #as .g2{grid-template-columns:1fr}
  }
</style>

<a href="/pharmacy" class="back-link">&#8592; Back to Pharmacy</a>

<div class="top">
  <h1>Add Stock</h1>
  <label style="margin:0;font-size:.82rem">Store <select id="wh" style="width:auto;display:inline-block"></select></label>
</div>

<div id="toast" role="status" hidden></div>
<datalist id="dl-prod"></datalist>

<div class="card">
  <h2>Stock entry</h2>
  <label for="st-prod" style="margin-top:0">Product name</label>
  <input id="st-prod" list="dl-prod" autocomplete="off" placeholder="Search or type product name">
  <div class="g2" style="margin-top:8px">
    <div>
      <label for="st-form" style="margin-top:0">Dosage form</label>
      <select id="st-form"></select>
    </div>
    <div>
      <label for="st-exist" style="margin-top:0">Batch</label>
      <select id="st-exist"><option value="">New batch</option></select>
    </div>
  </div>
  <div id="f-st"></div>
  <p class="hint">For an existing batch, the packs and units entered will set the new total stock. Automatically creates both Item and Medication entries.</p>
  <p style="margin:16px 0 0"><button type="button" class="btn go" id="st-save" style="width:100%">Save stock</button></p>
</div>

<script>
(function(){
var $=function(s){return document.querySelector('#as '+s)};
var csrf='',wh='',prodCache=[],stockBatches=[];

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function n(v){v=parseFloat(v);return isNaN(v)?0:v}
function inr(v){return '\u20B9'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mmyy(d){if(!d)return '-';var p=d.split('-');return p[1]+'/'+p[0].slice(2)}
function qtyText(q,u){u=u||1;var pk=Math.floor(q/u+1e-9),ls=Math.round(q-pk*u);return pk+' Pack'+(pk===1?'':'s')+', '+ls+' Unit'+(ls===1?'':'s')}
function toast(t,bad){var e=$('#toast');e.textContent=t||'';e.className=bad?'bad':'';e.hidden=!t;if(t)e.scrollIntoView({block:'nearest'})}
function debounce(fn){var t;return function(){clearTimeout(t);t=setTimeout(fn,250)}}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){
        var t='Something went wrong. Please try again.';
        try{var msgs=JSON.parse(j._server_messages);var last=JSON.parse(msgs[msgs.length-1]);t=(last.message||last).replace(/<[^>]+>/g,'')}catch(e){}
        if(/invalid request|not logged in/i.test(t)){window.location.replace('/login?redirect-to='+encodeURIComponent(window.location.pathname));return}
        throw new Error(t);
      }
      return j.message})})
}

function form(p){
  var gst=[0,5,12,18,28].map(function(g){return '<option'+(g===5?' selected':'')+' value="'+g+'">'+g+'%</option>'}).join('');
  return '<div class="g2"><div><label for="'+p+'-bno">Batch no</label><input id="'+p+'-bno" autocomplete="off"></div>'+
  '<div><label for="'+p+'-exp">Batch expiry (month/year)</label><input id="'+p+'-exp" type="month"></div></div>'+
  '<div class="g2"><div><label for="'+p+'-hsn">HSN code</label><input id="'+p+'-hsn" inputmode="numeric" value="3004"></div>'+
  '<div><label for="'+p+'-gst">Batch GST rate</label><select id="'+p+'-gst">'+gst+'</select></div></div>'+
  '<label for="'+p+'-mrp">MRP including GST</label><input id="'+p+'-mrp" type="number" step="any" inputmode="decimal">'+
  '<label for="'+p+'-rate">Purchase rate</label><div class="g2"><input id="'+p+'-rate" type="number" step="any" inputmode="decimal">'+
  '<select id="'+p+'-basis" aria-label="Rate basis"><option value="excl">Excluding GST</option><option value="incl">Including GST</option></select></div>'+
  '<div class="g2"><div><label for="'+p+'-upp">Unit per pack</label><input id="'+p+'-upp" type="number" min="1" inputmode="numeric" value="1"></div>'+
  '<p class="hint" style="align-self:end">e.g. 10 tablets per strip</p></div>'+
  '<div class="g2"><div><label for="'+p+'-packs">Number of packs</label><input id="'+p+'-packs" type="number" min="0" inputmode="numeric"></div>'+
  '<div><label for="'+p+'-units">Loose units if any</label><input id="'+p+'-units" type="number" min="0" inputmode="numeric" value="0"></div></div>'+
  '<div class="sum" style="margin-top:8px"><span>Margin <b id="'+p+'-mg">0.00%</b></span><span>Amount <b id="'+p+'-am">\u20B90.00</b></span></div>';
}

function g(p,k){return $('#'+p+'-'+k)}
function read(p){
  var m=g(p,'exp').value,exp='';
  if(m){var y=+m.slice(0,4),mo=+m.slice(5,7);exp=y+'-'+String(mo).padStart(2,'0')+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
  var gstEl=g(p,'gst');
  var gstVal=(gstEl&&gstEl.value)?gstEl.value:'5';
  return {batch:g(p,'bno').value.trim(),expiry:exp,hsn:(g(p,'hsn').value||'3004').trim(),gst:gstVal,mrp:g(p,'mrp').value,
  rate:g(p,'rate').value,basis:g(p,'basis').value,upp:g(p,'upp').value||'1',packs:g(p,'packs').value||'0',
  units:g(p,'units').value||'0',disc:'0'}
}

function calc(p){
  var d=read(p),gst=n(d.gst),excl=d.basis==='incl'?n(d.rate)/(1+gst/100):n(d.rate);
  var net=excl,mrpx=n(d.mrp)/(1+gst/100),upp=Math.max(1,n(d.upp));
  var mg=mrpx>0?(mrpx-net)/mrpx*100:0,amt=(n(d.packs)+n(d.units)/upp)*net;
  g(p,'mg').textContent=mg.toFixed(2)+'%';g(p,'am').textContent=inr(amt);
  return {net:net,amt:amt,gst:gst}
}

function clearForm(p){
  ['bno','exp','mrp','rate','packs'].forEach(function(k){g(p,k).value=''});
  g(p,'hsn').value='3004';g(p,'gst').value='5';g(p,'basis').value='excl';
  g(p,'upp').value='1';g(p,'units').value='0';
  calc(p)
}

$('#f-st').innerHTML=form('st');
$('#f-st').oninput=function(){calc('st')};
$('#f-st').onchange=$('#f-st').oninput;

call('ph_meta').then(function(m){
  csrf=m.csrf||'';wh=m.warehouse||'';
  $('#wh').innerHTML=m.warehouses.map(function(w){return '<option'+(w===wh?' selected':'')+'>'+esc(w)+'</option>'}).join('');
  var dfs=(m.dosage_forms&&m.dosage_forms.length)?m.dosage_forms:['Tablet','Capsule','Syrup','Injection','Drops','Ointment','Cream','Suspension','Inhaler','Gel','Lotion','Powder','Spray'];
  $('#st-form').innerHTML=dfs.map(function(f){return '<option'+(f==='Tablet'?' selected':'')+' value="'+esc(f)+'">'+esc(f)+'</option>'}).join('');
}).catch(function(e){toast(e.message,1)});

$('#wh').onchange=function(){wh=this.value};

function findProd(v){v=(v||'').trim();for(var i=0;i<prodCache.length;i++){if(prodCache[i].name===v||prodCache[i].code===v)return prodCache[i]}return null}

$('#st-prod').oninput=debounce(function(){
  call('ph_products',{q:$('#st-prod').value.trim()}).then(function(r){
    prodCache=r.products;$('#dl-prod').innerHTML=r.products.map(function(p){return '<option value="'+esc(p.name)+'">'}).join('')
  }).catch(function(){})
});

$('#st-prod').onchange=function(){
  var p=findProd(this.value),sel=$('#st-exist');
  sel.innerHTML='<option value="">New batch</option>';stockBatches=[];
  if(!p)return;
  call('ph_batches',{item:p.code}).then(function(r){
    stockBatches=r.batches;
    r.batches.forEach(function(b,i){sel.add(new Option(b.batch+' (exp '+mmyy(b.expiry)+', '+qtyText(b.qty,b.upp)+')',i))})
  }).catch(function(e){toast(e.message,1)})
};

$('#st-exist').onchange=function(){
  if(this.value===''){clearForm('st');return}
  var b=stockBatches[+this.value];
  g('st','bno').value=b.batch;g('st','exp').value=(b.expiry||'').slice(0,7);
  g('st','hsn').value=b.hsn||'3004';
  g('st','gst').value=String(b.gst||5);
  g('st','mrp').value=b.mrp||'';g('st','rate').value=b.purchase_rate||'';
  g('st','basis').value='excl';g('st','upp').value=b.upp||1;
  var pk=Math.floor(b.qty/(b.upp||1)+1e-9);g('st','packs').value=pk;g('st','units').value=Math.round(b.qty-pk*(b.upp||1));calc('st')
};

$('#st-save').onclick=function(){
  var prod=$('#st-prod').value.trim(),d=read('st'),b=this;
  if(!prod||!d.batch||!d.expiry){toast('Enter product, batch no and expiry.',1);return}
  if(n(d.mrp)<=0||n(d.rate)<=0){toast('Enter MRP and purchase rate.',1);return}
  d.product=prod;d.form=$('#st-form').value;d.warehouse=wh;b.disabled=true;
  call('ph_stock_save',d,true).then(function(r){
    toast('Saved batch '+r.batch+' of '+r.item+'. Total stock is now '+r.units+' unit(s).');
    clearForm('st');$('#st-prod').value='';$('#st-exist').innerHTML='<option value="">New batch</option>'
  }).catch(function(e){toast(e.message,1)}).then(function(){b.disabled=false})
};

calc('st');
})();
</script>
</div>
