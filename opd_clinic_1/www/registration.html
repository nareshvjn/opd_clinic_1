<!-- title: Patient Registration -->
<div id="apt">
<style>
#apt{
  --ink:#11281e;
  --mute:#546a5f;
  --line:#cfe0d7;
  --bg:#f4f9f6;
  --brand:#125c3a;
  --brand-dark:#0d3d27;
  --ok:#125c3a;
  --err:#c0392b;
  --gold:#f1c40f;
  --gold-text:#966f00;
  --gold-bg:#fffbe6;
  --gold-border:#f7dc6f;
  --shadow:0 8px 24px rgba(18,92,58,0.08);
  --shadow-sm:0 2px 8px rgba(18,92,58,0.05);
  max-width:560px;
  margin:0 auto;
  padding:14px 16px 48px;
  color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
}
#apt *{box-sizing:border-box}

/* Header */
#apt .top-header{
  text-align:center;
  padding:16px 16px 14px;
  margin-bottom:12px;
  background:linear-gradient(135deg,#0d3d27 0%,#125c3a 100%);
  border-radius:14px;
  color:#fff;
  box-shadow:var(--shadow);
}
#apt .top-badge{
  display:inline-block;
  background:linear-gradient(135deg,#f1c40f,#d4ac0d);
  color:#2b1d00;
  font-size:.68rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  border-radius:20px;
  padding:2px 10px;
  margin-bottom:6px;
}
#apt #btn-dash{
  transition:all .15s ease;
}
#apt #btn-dash:hover{
  background:rgba(255,255,255,0.3)!important;
  border-color:#fff!important;
}
#apt h1{font-size:1.35rem;font-weight:900;margin:0 0 4px;letter-spacing:-.01em;color:#fff}
#apt .lead{color:rgba(255,255,255,0.88);margin:0;font-size:.84rem;line-height:1.4}
#apt .form-lead{color:var(--mute);margin:0 0 10px;font-size:.84rem}

/* Segmented Toggle */
#apt .seg{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#eef6f2;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:3px;
  gap:3px;
  margin-bottom:12px;
}
#apt .seg button{
  padding:8px 8px;
  border:0;
  background:none;
  color:var(--mute);
  font:inherit;
  font-weight:700;
  font-size:.88rem;
  cursor:pointer;
  border-radius:8px;
  transition:all .15s ease;
}
#apt .seg button[aria-pressed=true]{
  background:var(--brand);
  color:#fff;
  box-shadow:0 2px 8px rgba(18,92,58,0.22);
}

/* Card & Fieldset */
#apt form{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:18px 18px;
  box-shadow:var(--shadow-sm);
}
#apt fieldset{border:0;padding:0;margin:0 0 16px}
#apt legend{
  font-weight:800;
  font-size:1.02rem;
  color:var(--brand);
  padding:0;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
#apt label{display:block;font-size:.8rem;font-weight:700;color:var(--ink);margin:7px 0 3px}
#apt input,#apt select,#apt textarea{
  width:100%;
  padding:8px 11px;
  border:1.5px solid var(--line);
  border-radius:8px;
  font:inherit;
  font-size:.9rem;
  color:var(--ink);
  background:#fff;
  min-height:38px;
  transition:border-color .15s ease,outline .15s ease;
}
#apt input:focus,#apt select:focus,#apt textarea:focus,#apt button:focus-visible{
  outline:3px solid #8cc9b5;
  outline-offset:1px;
  border-color:var(--brand);
}
#apt .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#apt .row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Buttons */
#apt .go{
  width:100%;
  margin-top:14px;
  padding:11px 16px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,#125c3a,#0d3d27);
  color:#fff;
  font:inherit;
  font-weight:800;
  font-size:.95rem;
  letter-spacing:.01em;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(18,92,58,0.25);
  transition:transform .15s ease,box-shadow .15s ease;
}
#apt .go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px rgba(18,92,58,0.35)}
#apt .go:disabled{opacity:.55;cursor:wait}
#apt .ghost{
  margin-top:8px;
  padding:8px 14px;
  border:1.5px solid var(--brand);
  border-radius:8px;
  background:#fff;
  color:var(--brand);
  font:inherit;
  font-weight:700;
  font-size:.88rem;
  cursor:pointer;
  transition:background .15s ease;
}
#apt .ghost:hover{background:var(--bg)}

/* Notes & Banners */
#apt .note{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--ok);font-size:.88rem}
#apt .note.bad{border-color:var(--err);background:#fdf2f2;color:var(--err)}
#apt .done{
  margin-bottom:14px;
  border-left:4px solid var(--ok);
  background:#ebf7f1;
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow-sm);
}

/* Patient Search Results */
#apt .res{display:grid;gap:8px;margin-top:10px}
#apt .res button{
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  align-items:baseline;
  text-align:left;
  width:100%;
  padding:9px 12px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
#apt .res button:hover{background:var(--bg);border-color:var(--brand)}
#apt .res button strong{flex:1 1 100%;font-size:.95rem;color:var(--brand)}
#apt .res button span{color:var(--mute);font-size:.82rem}
#apt .res button[aria-pressed=true]{border-color:var(--ok);background:#eef7f2;border-width:2px}

/* Upcoming Appointments */
#apt .up{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
#apt .up:first-of-type{border-top:0}
#apt [hidden]{display:none!important}

@media(max-width:540px){
  #apt{
    padding:10px 14px 44px;
    max-width:100%;
  }
  #apt form{
    padding:14px 12px;
    border-radius:12px;
  }
  #apt .top-header{
    padding:14px 12px 12px;
    border-radius:12px;
    margin-bottom:10px;
  }
  #apt .top-header h1{
    font-size:1.22rem;
  }
  #apt .top-header .lead{
    font-size:0.78rem;
  }
  #apt .row{grid-template-columns:1fr;gap:6px}
  #apt .row-2{grid-template-columns:1fr 1fr;gap:6px}
  #apt input,#apt select,#apt textarea{
    padding:7px 9px;
    font-size:.86rem;
    min-height:36px;
  }
  #apt label{
    margin:6px 0 2px;
    font-size:.76rem;
  }
}
</style>

<div class="top-header">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px">
    <div class="top-badge" style="margin-bottom:0">✦ OPD Registration</div>
    <div style="display:flex;align-items:center;gap:6px">
      <a href="/dashboard" id="btn-dash" hidden style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.45);padding:3px 10px;border-radius:20px;color:#fff;text-decoration:none;font-size:.76rem;font-weight:700">📊 Dashboard</a>
      <div id="clinic-user-profile" class="clinic-profile-slot"></div>
    </div>
  </div>
  <h1>Book an Appointment</h1>
  <p class="lead">Registered patient? Look up your records. First-time visitor? Register and confirm your slot instantly.</p>
</div>

<div class="seg">
  <button type="button" id="m-new" aria-pressed="true">New Patient</button>
  <button type="button" id="m-exist" aria-pressed="false">Existing Patient</button>
</div>

<div id="done" class="note done" hidden></div>

<form id="f" novalidate>
  <fieldset id="s-new">
    <legend>Register as a new patient</legend>
    <div class="row-2">
      <div>
        <label for="n-first">First name <span style="color:var(--err)">*</span></label>
        <input id="n-first" autocomplete="given-name" placeholder="First name" required>
      </div>
      <div>
        <label for="n-last">Last name</label>
        <input id="n-last" autocomplete="family-name" placeholder="Last name">
      </div>
    </div>
    <div class="row-2">
      <div>
        <label for="n-sex">Gender <span style="color:var(--err)">*</span></label>
        <select id="n-sex">
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="n-age">Age (years)</label>
        <input id="n-age" type="number" min="0" max="120" inputmode="numeric" placeholder="Age (e.g. 35)">
      </div>
    </div>
    <div class="row-2">
      <div>
        <label for="n-dob">Date of birth (opt)</label>
        <input id="n-dob" type="date">
      </div>
      <div>
        <label for="n-uid">Patient ID (UID)</label>
        <input id="n-uid" placeholder="Auto-assigned" style="font-weight:700;color:var(--ok)">
      </div>
    </div>
    <div class="row-2">
      <div>
        <label for="n-mobile">Mobile number <span style="color:var(--err)">*</span></label>
        <input id="n-mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" placeholder="10-digit mobile" required>
      </div>
      <div>
        <label for="n-email">Email (optional)</label>
        <input id="n-email" type="email" autocomplete="email" placeholder="Email address">
      </div>
    </div>
  </fieldset>

  <fieldset id="s-exist" hidden>
    <legend>Find existing patient</legend>
    
    <div id="exist-guest">
      <p class="lead" style="margin:0 0 8px;font-size:0.82rem;color:var(--mute);line-height:1.4">Enter your Patient ID (or full name) and registered mobile number.</p>
      <div class="row-2">
        <div>
          <label for="eg-ident">Patient ID or Name</label>
          <input id="eg-ident" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="UID or Name">
        </div>
        <div>
          <label for="eg-mobile">Registered Mobile</label>
          <input id="eg-mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
      </div>
      <button type="button" class="ghost" id="eg-find" style="width:100%;margin-top:8px;padding:9px;font-weight:700">Find My Record</button>
    </div>

    <div id="exist-staff" hidden>
      <label for="e-query">Staff Search (Name, Mobile number, or Patient ID)</label>
      <div style="display:flex;gap:8px">
        <input id="e-query" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search patient...">
        <button type="button" class="ghost" id="find" style="margin:0;white-space:nowrap;padding:8px 14px">Search</button>
      </div>
    </div>

    <div id="found" hidden></div>
    <div id="upc"></div>
  </fieldset>

  <fieldset id="s-appt">
    <legend>Choose your appointment</legend>
    <div id="edit-banner" class="note" hidden><span></span> <button type="button" class="ghost" id="edit-cancel">Stop editing</button></div>
    <div class="row-2">
      <div>
        <label for="a-prac">Doctor</label>
        <select id="a-prac"><option value="">Select doctor</option></select>
      </div>
      <div>
        <label for="a-type">Visit type</label>
        <select id="a-type"><option value="">Select visit type</option></select>
      </div>
    </div>
    <div class="row-2">
      <div>
        <label for="a-date">Date</label>
        <input id="a-date" type="date">
      </div>
      <div>
        <label for="a-slot">Time</label>
        <select id="a-slot" disabled><option value="">Select date first</option></select>
      </div>
    </div>
    <p class="lead" id="slot-note" aria-live="polite" style="margin:4px 0 0;font-size:.8rem;color:var(--mute)"></p>
    <input id="a-time" type="time" hidden aria-label="Preferred time">
    <label for="a-notes">Reason for visit (optional)</label>
    <textarea id="a-notes" rows="2" placeholder="Brief reason or symptoms (optional)"></textarea>
    <button type="submit" class="go" id="book">Book appointment</button>
  </fieldset>
  <div id="err" class="note bad" role="alert" hidden></div>
</form>

<script>
(function(){
var $=function(s){return document.querySelector('#apt '+s)};
var mode='new',slot='',manual=false,patientId='',csrf='',editId='',pendingSlot='',nextUid='',isGuest=true,upc=[];

function applySessionMode(){
  if($('#exist-guest')) $('#exist-guest').hidden = !isGuest;
  if($('#exist-staff')) $('#exist-staff').hidden = isGuest;
}

function call(method,data,post){
  var p=new URLSearchParams(data||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){
        var t='';
        if(j._server_messages){
          try{
            var msgs=typeof j._server_messages==='string'?JSON.parse(j._server_messages):j._server_messages;
            var last=typeof msgs[msgs.length-1]==='string'?JSON.parse(msgs[msgs.length-1]):msgs[msgs.length-1];
            t=(last.message||last||'').replace(/<[^>]+>/g,'').trim();
          }catch(e){}
        }
        if(!t&&j.exception){
          var exp=String(j.exception).split(':');
          t=exp.length>1?exp.slice(1).join(':').trim():exp[0].trim();
        }
        if(!t&&j.message){
          t=typeof j.message==='string'?j.message:JSON.stringify(j.message);
        }
        if(!t)t='Something went wrong. Please try again.';
        if(/invalid request/i.test(t))t='Your session expired. Refresh the page and try again.';throw new Error(t)}
      return j.message})})
}
function showErr(t){var e=$('#err');e.textContent=t||'';e.hidden=!t}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function setDefaultVisitType(targetMode){
  var mType = targetMode || mode;
  var sel = $('#a-type');
  if(!sel || !sel.options || sel.options.length <= 1) return;
  var keys = (mType === 'existing') ? ['review', 'follow'] : ['new'];
  var matched = '';
  for(var k = 0; k < keys.length; k++){
    var key = keys[k];
    for(var i = 0; i < sel.options.length; i++){
      var optVal = sel.options[i].value;
      if(optVal && optVal.toLowerCase() === key){
        matched = optVal;
        break;
      }
    }
    if(matched) break;
    for(var j = 0; j < sel.options.length; j++){
      var oVal = sel.options[j].value;
      if(oVal && oVal.toLowerCase().indexOf(key) !== -1){
        matched = oVal;
        break;
      }
    }
    if(matched) break;
  }
  if(matched){
    sel.value = matched;
  }
}

function setMode(m){
  mode=m;showErr('');
  $('#m-new').setAttribute('aria-pressed',m==='new');
  $('#m-exist').setAttribute('aria-pressed',m==='existing');
  $('#s-new').hidden=m!=='new';
  $('#s-exist').hidden=m!=='existing';
  $('#s-appt').hidden=m==='existing'?!patientId:false;
  if(m==='new'&&nextUid&&!$('#n-uid').value){$('#n-uid').value=nextUid;}
  if(!$('#a-date').value) $('#a-date').value=iso(new Date());
  setDefaultVisitType(m);
  if(m==='existing'){
    applySessionMode();
    setTimeout(function(){
      if(isGuest && $('#eg-ident')) $('#eg-ident').focus();
      else if($('#e-query')) $('#e-query').focus();
    }, 60);
  }
}
$('#m-new').onclick=function(e){
  e.preventDefault();
  window.location.href='/registration?mode=new';
};
$('#m-exist').onclick=function(e){
  e.preventDefault();
  window.location.href='/registration?mode=existing';
};
var urlParams = new URLSearchParams(window.location.search);
var initialMode = urlParams.get('mode') === 'existing' ? 'existing' : 'new';
if(!$('#a-date').value) $('#a-date').value=iso(new Date());
$('#a-date').min=iso(new Date());
setMode(initialMode);

function dlabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function endEdit(){editId='';pendingSlot='';$('#edit-banner').hidden=true;$('#book').textContent='Book appointment'}
function loadUpcoming(){
  var box=$('#upc');box.innerHTML='';upc=[];
  call('appt_upcoming',{patient:patientId}).then(function(r){
    if(r.guest){box.innerHTML='<p class="hint">Log in with a staff account to edit this patient\'s existing appointments.</p>';return}
    upc=r.appointments||[];if(!upc.length)return;
    box.innerHTML='<div class="note"><b>Upcoming appointments</b>'+upc.map(function(a,i){
      return '<div class="up"><span><b>'+esc(dlabel(a.date))+', '+esc(fmt(a.time))+'</b><br>'+esc(a.practitioner_name)+', '+esc(a.type)+'</span><button type="button" class="ghost" data-i="'+i+'">Edit</button></div>'}).join('')+'</div>'
  }).catch(function(e){
    if(/not permitted|permission|log in/i.test(e.message))box.innerHTML='<p class="hint">Log in with a staff account to edit this patient\'s existing appointments.</p>';
    else showErr(e.message)})
}
function startEdit(a){
  editId=a.id;pendingSlot=a.time;showErr('');
  $('#a-prac').value=a.practitioner;$('#a-type').value=a.type;$('#a-date').value=a.date;$('#a-notes').value=a.notes||'';
  $('#edit-banner span').textContent='Editing '+a.id+'. Change anything, then press Update appointment.';
  $('#edit-banner').hidden=false;$('#book').textContent='Update appointment';loadSlots();
  $('#s-appt').scrollIntoView({behavior:'smooth',block:'start'})
}
$('#upc').onclick=function(e){var b=e.target.closest('button[data-i]');if(b)startEdit(upc[+b.dataset.i])};
$('#edit-cancel').onclick=endEdit;
$('#n-age').oninput=function(){
  var a=parseInt(this.value,10);if(isNaN(a)||a<0||a>120)return;
  var t=new Date();$('#n-dob').value=iso(new Date(t.getFullYear()-a,t.getMonth(),t.getDate()))
};
$('#n-dob').onchange=function(){
  if(!this.value)return;
  var d=new Date(this.value+'T12:00:00'),t=new Date(),a=t.getFullYear()-d.getFullYear();
  if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;
  $('#n-age').value=a>=0?a:''
};
function doGuestSearch(){
  var ident=($('#eg-ident').value||'').trim();
  var rawMobile=($('#eg-mobile').value||'').trim();
  var mobile=rawMobile.replace(/\D/g,'');
  var box=$('#found');
  showErr('');
  if(!ident||!rawMobile){
    box.hidden=false;box.className='note bad';
    box.textContent='Please enter both your Patient ID (or Full Name) AND your registered mobile number.';
    return;
  }
  if(mobile.length!==10){
    box.hidden=false;box.className='note bad';
    box.textContent='Please enter a valid 10-digit mobile number.';
    return;
  }
  box.hidden=false;box.className='note';box.textContent='Verifying patient record…';
  call('appt_search',{identifier:ident,mobile:mobile}).then(function(r){
    var list=r.patients||[];
    if(!list.length){
      box.className='note bad';
      box.innerHTML='No patient record matches both that ID/Name and mobile number.<br><button type="button" class="ghost" id="to-new" style="margin-top:8px">Register as a new patient</button>';
      $('#to-new').onclick=function(){window.location.href='/registration?mode=new'};
      return;
    }
    box.className='res';box.innerHTML='';
    list.forEach(function(p){
      var c=document.createElement('button');c.type='button';c.setAttribute('aria-pressed','true');
      patientId=p.id;
      var ptUid=(p.uid&&p.uid!==p.name)?p.uid:'';
      c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;width:100%">' +
        '<strong>&#10003; '+esc(p.name)+(ptUid?' <span style="font-weight:600;color:var(--ok)">('+esc(ptUid)+')</span>':'')+'</strong>' +
        '<span style="font-size:0.85rem;color:var(--ok);font-weight:600">Verified</span>' +
        '</div>' +
        '<span>Age '+(p.age==null?'not recorded':esc(String(p.age)))+'</span>' +
        '<span>Mobile '+(p.mobile?esc(p.mobile):'on file')+'</span>';
      c.onclick=function(){
        patientId=p.id;
        box.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===c)});
        $('#s-appt').hidden=false;
        endEdit();
        if(!$('#a-date').value) $('#a-date').value=iso(new Date());
        setDefaultVisitType('existing');
        loadUpcoming();
        loadSlots();
        $('#s-appt').scrollIntoView({behavior:'smooth',block:'start'});
      };
      box.appendChild(c);
      $('#s-appt').hidden=false;
      endEdit();
      if(!$('#a-date').value) $('#a-date').value=iso(new Date());
      setDefaultVisitType('existing');
      loadUpcoming();
      loadSlots();
      $('#s-appt').scrollIntoView({behavior:'smooth',block:'start'});
    });
  }).catch(function(e){box.className='note bad';box.textContent=e.message});
}
if($('#eg-find'))$('#eg-find').onclick=doGuestSearch;
if($('#eg-ident'))$('#eg-ident').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doGuestSearch()}};
if($('#eg-mobile')){
  $('#eg-mobile').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,10)};
  $('#eg-mobile').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();doGuestSearch()}};
}
if($('#n-mobile')){
  $('#n-mobile').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,10)};
}

var searchTimer=null;
function doSearch(){
  var q=($('#e-query').value||'').trim(),box=$('#found');
  showErr('');
  if(q.length<2){box.hidden=true;box.innerHTML='';return}
  box.hidden=false;box.className='note';box.textContent='Searching patients…';
  call('appt_search',{query:q}).then(function(r){
    var list=r.patients||[];
    if(!list.length){
      box.className='note bad';
      box.innerHTML='No patient matches "'+esc(q)+'".<br><button type="button" class="ghost" id="to-new" style="margin-top:8px">Register as a new patient</button>';
      $('#to-new').onclick=function(){window.location.href='/registration?mode=new'};
      return;
    }
    box.className='res';box.innerHTML='';
    list.forEach(function(p){
      var c=document.createElement('button');c.type='button';c.setAttribute('aria-pressed',p.id===patientId?'true':'false');
      var ptUid=(p.uid&&p.uid!==p.name)?p.uid:'';
      c.innerHTML='<strong>'+esc(p.name)+(ptUid?' <span style="font-weight:600;color:var(--ok)">('+esc(ptUid)+')</span>':'')+'</strong><span>Age '+(p.age==null?'not recorded':esc(String(p.age)))+'</span><span>Mobile '+(p.mobile?esc(p.mobile):'not on file')+'</span>';
      c.onclick=function(){
        patientId=p.id;
        box.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===c)});
        $('#s-appt').hidden=false;
        endEdit();
        if(!$('#a-date').value) $('#a-date').value=iso(new Date());
        setDefaultVisitType('existing');
        loadUpcoming();
        loadSlots();
        $('#s-appt').scrollIntoView({behavior:'smooth',block:'start'});
      };
      box.appendChild(c);
    });
  }).catch(function(e){box.className='note bad';box.textContent=e.message});
}
$('#e-query').oninput=function(){if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,250)};
$('#find').onclick=function(){if(searchTimer)clearTimeout(searchTimer);doSearch()};
$('#e-query').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();if(searchTimer)clearTimeout(searchTimer);doSearch()}};

function fmt(t){var p=t.split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function loadSlots(){
  var pr=$('#a-prac').value,d=$('#a-date').value,sel=$('#a-slot'),note=$('#slot-note');
  slot='';manual=false;$('#a-time').hidden=true;note.textContent='';
  sel.innerHTML='<option value="">Pick a doctor and date first</option>';sel.disabled=true;
  if(!pr||!d)return;
  sel.innerHTML='<option value="">Checking availability…</option>';
  call('appt_slots',{practitioner:pr,date:d,exclude:editId}).then(function(r){
    var s=r.slots||[];
    if(!s.length){sel.innerHTML='<option value="">No free times on this date</option>';return}
    sel.innerHTML='<option value="">Select a time ('+s.length+' available)</option>';
    s.forEach(function(t){sel.add(new Option(fmt(t),t))});
    sel.disabled=false;
    if(pendingSlot){sel.value=pendingSlot;slot=sel.value;pendingSlot=''}
    note.textContent=r.source==='default'?'Showing clinic hours, since this doctor has no schedule for this day.':''
  }).catch(function(e){
    sel.innerHTML='<option value="">Times unavailable</option>';
    note.textContent='Times couldn\'t be loaded ('+e.message+'). Enter your preferred time and the clinic will confirm it.';
    manual=true;$('#a-time').hidden=false;if(pendingSlot){$('#a-time').value=pendingSlot;pendingSlot=''}})
}
$('#a-slot').onchange=function(){slot=this.value};
$('#a-prac').onchange=loadSlots;$('#a-date').onchange=loadSlots;
$('#a-date').min=iso(new Date());
if(!$('#a-date').value) $('#a-date').value=iso(new Date());

call('appt_meta').then(function(m){csrf=m.csrf||'';
  if(typeof m.is_guest!=='undefined')isGuest=!!m.is_guest;
  applySessionMode();
  if(m.can_view_dashboard){
    var dBtn=$('#btn-dash');
    if(dBtn) dBtn.hidden=false;
  }
  if(m.next_uid){
    nextUid=m.next_uid;
    if($('#n-uid')&&!$('#n-uid').value)$('#n-uid').value=m.next_uid;
  }
  m.practitioners.forEach(function(p){var o=new Option(p.practitioner_name+(p.department?' ('+p.department+')':''),p.name);$('#a-prac').add(o)});
  m.types.forEach(function(t){$('#a-type').add(new Option(t,t))});
  setDefaultVisitType(mode);
  if(!$('#a-date').value) $('#a-date').value=iso(new Date());
  loadSlots();
}).catch(function(){showErr('The booking form couldn\'t load. Please refresh or contact the clinic.')});

$('#f').onsubmit=function(ev){
  ev.preventDefault();showErr('');
  var isNew=mode==='new',time=manual?$('#a-time').value:($('#a-slot').value||slot);
  var d={mode:mode,practitioner:$('#a-prac').value,appointment_type:$('#a-type').value,date:$('#a-date').value,time:time,notes:$('#a-notes').value};
  if(isNew){d.uid=$('#n-uid').value.trim();d.first_name=$('#n-first').value.trim();d.last_name=$('#n-last').value.trim();d.sex=$('#n-sex').value;
    d.dob=$('#n-dob').value;d.mobile=$('#n-mobile').value.trim();d.email=$('#n-email').value.trim();
    if(!d.first_name||!d.sex){showErr('Enter the first name and gender.');return}
    if(!d.mobile){showErr('Enter the mobile number.');return}
    var cleanM=d.mobile.replace(/\D/g,'');
    if(cleanM.length<10){showErr('Enter a valid 10-digit mobile number.');return}}
  else{if(!patientId){showErr('Search for the patient and select them first.');return}d.patient=patientId}
  if(!d.practitioner||!d.appointment_type||!d.date||!d.time){showErr('Choose a doctor, visit type, date and time.');return}
  var b=$('#book');b.disabled=true;b.textContent=editId?'Updating…':'Booking…';
  var req=editId?call('appt_update',{patient:patientId,appointment:editId,practitioner:d.practitioner,appointment_type:d.appointment_type,date:d.date,time:d.time,notes:d.notes},true):call('appt_book',d,true);
  req.then(function(r){
    var assignedUid=(r&&r.uid)||d.uid||'';
    var uidMsg=assignedUid?' &bull; Patient ID: <strong>'+esc(assignedUid)+'</strong>':'';
    var ptName=(r&&r.patient_name)||(d.first_name?(d.first_name+(d.last_name?' '+d.last_name:'')):(d.patient||''));
    var ptMsg=ptName?' &bull; Patient: <strong>'+esc(ptName)+'</strong>':'';
    var n=$('#done');
    n.hidden=false;
    n.innerHTML='<div style="display:flex;justify-content:space-between;align-items:start">' +
      '<div><h2 style="margin:0 0 6px;color:var(--ok);font-size:1.15rem">&#10003; '+(editId?'Appointment updated successfully':'Appointment booked successfully')+'</h2>' +
      'Reference <strong>'+esc(r.appointment)+'</strong>'+ptMsg+uidMsg+'<br>' +
      esc(d.date)+' at '+esc(manual?d.time:fmt(d.time))+(manual?' (the clinic will confirm this time)':'')+'.' +
      '</div>' +
      '<button type="button" class="ghost" id="done-close" style="margin:0;padding:4px 8px;font-size:1.1rem;line-height:1;border:none;cursor:pointer" title="Dismiss">&times;</button>' +
      '</div>';
    $('#done-close').onclick=function(){n.hidden=true};
    n.scrollIntoView({behavior:'smooth',block:'start'});

    b.disabled=false;
    b.textContent='Book appointment';
    endEdit();
    $('#n-first').value='';$('#n-last').value='';$('#n-sex').value='';
    $('#n-dob').value='';$('#n-age').value='';$('#n-mobile').value='';$('#n-email').value='';
    $('#a-notes').value='';$('#n-uid').value='';
    patientId='';
    if($('#e-query'))$('#e-query').value='';
    if($('#eg-ident'))$('#eg-ident').value='';
    if($('#eg-mobile'))$('#eg-mobile').value='';
    if($('#found')){ $('#found').hidden=true;$('#found').innerHTML=''; }
    if($('#upc'))$('#upc').innerHTML='';

    $('#a-date').value = iso(new Date());
    setMode('new');
    setDefaultVisitType('new');

    call('appt_meta').then(function(m){
      if(m.next_uid){
        nextUid=m.next_uid;
        $('#n-uid').value=m.next_uid;
      }
    });
    loadSlots();
  }).catch(function(e){showErr(e.message);b.disabled=false;b.textContent=editId?'Update appointment':'Book appointment';if(/already booked/i.test(e.message))loadSlots()})
};
})();
</script>

</div>
