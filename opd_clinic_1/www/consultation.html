<!-- title: Consultation -->
<div id="en">
<style>
#en{--ink:#16324a;--mute:#5d7184;--line:#cfdad5;--bg:#f3f8f5;--ok:#1d7a5f;--err:#b3261e;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;height:calc(100vh - 92px);min-height:620px;max-width:1880px;margin:0 auto;padding:8px 4px 0;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.web-footer,body>footer{display:none!important}
#en *{box-sizing:border-box}
#en a.back{color:#cfeee2;font-weight:600;text-decoration:none;font-size:.9rem;white-space:nowrap}
#en .pt{flex:none;display:flex;gap:14px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--ink);color:#fff}
#en .av{flex:none;width:40px;height:40px;border-radius:50%;background:#8cc9b5;color:var(--ink);display:grid;place-items:center;font-weight:800}
#en h1{font-size:1.25rem;margin:0;line-height:1.2}
#en .pt p{margin:0;font-size:.88rem;opacity:.88}
#en .pt .ap{margin-left:auto;text-align:right;font-size:.85rem}
#en .pt .ap b{display:block;font-size:1rem}
#en h2{font-size:.95rem;margin:0 0 6px}
#en .card{padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:0}
#en label{display:block;font-size:.76rem;font-weight:600;margin:0 0 2px;color:var(--mute)}
#en input,#en select,#en textarea{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
#en input:focus,#en select:focus,#en textarea:focus,#en button:focus-visible{outline:3px solid #8cc9b5;outline-offset:1px}
#en #form{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:10px}
#en .main{display:flex;flex-direction:column;gap:10px;min-height:0}
#en .side{display:flex;flex-direction:column;gap:10px;min-height:0}
#en .vg{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
#en .pair{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#en .pair .card{display:flex;flex-direction:column}
#en .pair textarea{flex:1;min-height:60px;resize:none}
#en .tags{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;padding:5px;min-height:58px;border:1.5px solid var(--line);border-radius:8px}
#en .tags input{flex:1 1 130px;border:0;padding:4px;min-width:0}
#en .tags input:focus{outline:none}
#en .tags:focus-within{outline:3px solid #8cc9b5}
#en .chip{display:inline-flex;gap:4px;align-items:center;padding:2px 3px 2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.9rem}
#en .chip.new{border-style:dashed}
#en .chip button{border:0;background:none;color:var(--mute);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px}
#en .meds{flex:1;min-height:150px;display:flex;flex-direction:column}
#en #meds{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
#en .med{display:grid;grid-template-columns:minmax(170px,2.4fr) minmax(90px,1fr) minmax(90px,1fr) minmax(90px,1fr) minmax(130px,2fr) auto;gap:6px 8px;align-items:end;padding:6px 0;border-top:1px solid var(--line)}
#en .med:first-child{border-top:0;padding-top:0}
#en .nn{grid-column:1/-1;display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:2px 0 2px}
#en .nn>div{min-width:110px}
#en .nn .hint{margin:0 6px 6px 0}
#en .mf{flex:none;display:flex;gap:10px;align-items:center;padding-top:6px}
#en button.sm{padding:7px 12px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
#en .hint{color:var(--mute);font-size:.85rem;margin:0}
#en .hist{flex:1;display:flex;flex-direction:column}
#en #hx{flex:1;min-height:0;overflow-y:auto}
#en .hx{padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
#en .hx:first-child{border-top:0}
#en .hx b{display:block}
#en .acts{flex:none;display:flex;gap:8px}
#en .acts button{flex:1;padding:12px 8px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
#en .acts button.go{background:var(--ok);border-color:var(--ok);color:#fff}
#en .acts button:disabled{opacity:.55;cursor:wait}
#en a.pb{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;text-decoration:none;text-align:center}
#en .note{flex:none;padding:9px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--ok)}
#en .note.bad{border-color:var(--err);background:#fdf0ef}
#en [hidden]{display:none!important}
@media(max-width:1100px){#en{height:auto;min-height:0}#en #form{grid-template-columns:1fr}#en #meds{overflow:visible}#en .meds{min-height:0}#en .vg{grid-template-columns:repeat(4,1fr)}#en .med{grid-template-columns:1fr 1fr 1fr}#en .hist{flex:none}#en #hx{overflow:visible}}
@media(max-width:700px){#en .pair{grid-template-columns:1fr}#en .vg{grid-template-columns:1fr 1fr}#en .med{grid-template-columns:1fr}#en .pt{flex-wrap:wrap}#en .pt .ap{margin-left:0;text-align:left}}
</style>

<datalist id="dl-sym"></datalist><datalist id="dl-dx"></datalist><datalist id="dl-med"></datalist><datalist id="dl-lab"></datalist><datalist id="dl-uom"></datalist>

<header class="pt">
  <a class="back" href="/doctor-desk">&larr; Doctor desk</a>
  <div class="av" id="av">&middot;</div>
  <div><h1 id="pn">Loading&hellip;</h1><p id="pm"></p></div>
  <div class="ap" id="ap"></div>
</header>
<div id="msg" class="note bad" role="alert" hidden></div>

<div id="form" hidden>
  <div class="main">
    <section class="card">
      <h2>Vitals</h2>
      <div class="vg">
        <div><label for="v-temperature">Temp (&deg;F)</label><input id="v-temperature" type="number" step="any" inputmode="decimal" placeholder="98.6"></div>
        <div><label for="v-pulse">Pulse (/min)</label><input id="v-pulse" type="number" inputmode="numeric"></div>
        <div><label for="v-bp_systolic">BP systolic</label><input id="v-bp_systolic" type="number" inputmode="numeric"></div>
        <div><label for="v-bp_diastolic">BP diastolic</label><input id="v-bp_diastolic" type="number" inputmode="numeric"></div>
        <div><label for="v-respiratory_rate">Resp (/min)</label><input id="v-respiratory_rate" type="number" inputmode="numeric"></div>
        <div><label for="v-height">Height (cm)</label><input id="v-height" type="number" step="any" inputmode="decimal"></div>
        <div><label for="v-weight">Weight (kg)</label><input id="v-weight" type="number" step="any" inputmode="decimal"></div>
        <div><label for="v-bmi">BMI</label><input id="v-bmi" readonly tabindex="-1"></div>
      </div>
    </section>

    <div class="pair">
      <section class="card"><h2>Complaints</h2>
        <div class="tags" id="tg-sym"><input id="in-sym" list="dl-sym" placeholder="Type and press Enter (new ones are added)" aria-label="Add complaint"></div>
      </section>
      <section class="card"><h2>Diagnosis</h2>
        <div class="tags" id="tg-dx"><input id="in-dx" list="dl-dx" placeholder="Type and press Enter (new ones are added)" aria-label="Add diagnosis"></div>
      </section>
    </div>

    <section class="card meds"><h2>Medicines</h2>
      <div id="meds"></div>
      <div class="mf"><button type="button" class="sm" id="add-med">Add medicine</button><span class="hint" id="med-hint"></span></div>
    </section>

    <div class="pair">
      <section class="card"><h2>Lab tests</h2>
        <div class="tags" id="tg-lab"><input id="in-lab" list="dl-lab" placeholder="Type and press Enter" aria-label="Add lab test"></div>
      </section>
      <section class="card"><h2>Notes</h2>
        <textarea id="notes" rows="3" aria-label="Consultation notes" placeholder="Examination findings, advice, follow-up"></textarea>
      </section>
    </div>
  </div>

  <aside class="side">
    <section class="card hist"><h2>Previous visits</h2><div id="hx"></div></section>
    <div class="acts">
      <button type="button" id="draft">Save draft</button>
      <button type="button" class="go" id="complete">Complete consultation</button>
    </div>
  </aside>
</div>

<div id="done" class="note" hidden></div>

<script>
(function(){
var $=function(s){return document.querySelector('#en '+s)};
var q=new URLSearchParams(location.search),A=q.get('appointment')||'',P=q.get('patient')||'',D=q.get('practitioner')||'';
var amend=false,csrf='',T={sym:[],dx:[],lab:[]},M=[],L={},MF={},NEW={sym:'complaints',dx:'diagnoses'},VK=['temperature','pulse','bp_systolic','bp_diastolic','respiratory_rate','height','weight'];

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(t){var p=String(t).split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function pu(n){return '/printview?doctype=Patient%20Encounter&name='+encodeURIComponent(n)+'&trigger_print=1'}
function msg(t,ok){var e=$('#msg');e.textContent=t||'';e.className='note'+(ok?'':' bad');e.hidden=!t;if(t)e.scrollIntoView({block:'nearest'})}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        if(/invalid request/i.test(t))t='Your session expired. Refresh the page and try again.';
        throw new Error(t)}
      return j.message})})
}

function fill(id,arr){$('#'+id).innerHTML=(arr||[]).map(function(v){return '<option value="'+esc(v)+'">'}).join('')}

function renderTags(k){
  var box=$('#tg-'+k),inp=$('#in-'+k);
  box.querySelectorAll('.chip').forEach(function(c){c.remove()});
  T[k].forEach(function(v,i){var c=document.createElement('span');c.className='chip'+(NEW[k]&&(L[NEW[k]]||[]).indexOf(v)<0?' new':'');
    c.innerHTML=esc(v)+'<button type="button" aria-label="Remove '+esc(v)+'" data-k="'+k+'" data-i="'+i+'">&times;</button>';
    box.insertBefore(c,inp)})
}
function addTag(k,v){v=(v||'').trim();if(!v||T[k].indexOf(v)>-1)return;T[k].push(v);renderTags(k)}
['sym','dx','lab'].forEach(function(k){
  var inp=$('#in-'+k);
  inp.onkeydown=function(e){if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(k,inp.value);inp.value=''}};
  inp.onchange=function(){addTag(k,inp.value);inp.value=''};
  inp.onblur=function(){if(inp.value.trim()){addTag(k,inp.value);inp.value=''}}
});
$('#form').onclick=function(e){
  var b=e.target.closest('.chip button');
  if(b){T[b.dataset.k].splice(+b.dataset.i,1);renderTags(b.dataset.k);return}
  var r=e.target.closest('button[data-rm]');
  if(r){M.splice(+r.dataset.rm,1);renderMeds()}
};

function opts(list,cur,ph){return '<option value="">'+ph+'</option>'+list.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function guess(v){
  var m=v.match(/(\d+(?:\.\d+)?)\s*(mcg|mg|ml|iu|g|%)(?![a-z])/i);if(!m)return null;
  var al={mg:['mg','Milligram'],mcg:['mcg','Microgram'],g:['g','Gram'],ml:['ml','Millilitre','Milliliter'],iu:['IU'],'%':['%','Percent']}[m[2].toLowerCase()],u=m[2].toLowerCase();
  for(var i=0;i<al.length;i++){var f=L.uoms.filter(function(x){return x.toLowerCase()===al[i].toLowerCase()})[0];if(f){u=f;break}}
  return {s:m[1],u:u}
}
function blankMed(){return {drug:'',form:'',mclass:'',strength:'',unit:'',dosage:'',period:'',comment:''}}
function renderMeds(){
  var box=$('#meds');
  if(!M.length)M.push(blankMed());
  box.innerHTML=M.map(function(m,i){
    var isNew=m.drug.trim()&&L.medications.indexOf(m.drug.trim())<0;
    return '<div class="med"><div><label>Medicine</label><input list="dl-med" data-i="'+i+'" data-f="drug" value="'+esc(m.drug)+'" placeholder="Search, or type a new medicine"></div>'+
      '<div><label>Form</label><select data-i="'+i+'" data-f="form">'+opts(L.forms,m.form,'Select')+'</select></div>'+
      '<div><label>Dosage</label><select data-i="'+i+'" data-f="dosage">'+opts(L.dosages,m.dosage,'Select')+'</select></div>'+
      '<div><label>Duration</label><select data-i="'+i+'" data-f="period">'+opts(L.periods,m.period,'Select')+'</select></div>'+
      '<div><label>Instructions</label><input data-i="'+i+'" data-f="comment" value="'+esc(m.comment)+'" placeholder="For example after food" aria-label="Instructions"></div>'+
      '<button type="button" class="sm" data-rm="'+i+'" aria-label="Remove medicine">Remove</button>'+
      '<div class="nn"'+(isNew?'':' hidden')+'><span class="hint">'+(L.items.indexOf(m.drug.trim())>-1?'Pharmacy item with no Medication record yet. One will be created when you save.':'New medicine. It will be added to the item list and to Medication when you save.')+'</span>'+
      '<div><label>Medication class</label><select data-i="'+i+'" data-f="mclass">'+opts(L.classes,m.mclass,'Choose automatically')+'</select></div>'+
      '<div><label>Strength</label><input type="number" step="any" inputmode="decimal" data-i="'+i+'" data-f="strength" value="'+esc(m.strength)+'" placeholder="10"></div>'+
      '<div><label>Unit</label><input list="dl-uom" data-i="'+i+'" data-f="unit" value="'+esc(m.unit)+'" placeholder="mg"></div></div></div>'
  }).join('')
}
$('#meds').oninput=$('#meds').onchange=function(e){
  var t=e.target;if(!t.dataset.f)return;
  M[+t.dataset.i][t.dataset.f]=t.value;
  if(t.dataset.f==='drug'){
    var row=t.closest('.med'),v=t.value.trim(),sel=row.querySelector('select[data-f=form]');
    var known=!v||L.medications.indexOf(v)>-1;
    row.querySelector('.nn').hidden=known;
    row.querySelector('.nn .hint').textContent=L.items.indexOf(v)>-1?'Pharmacy item with no Medication record yet. One will be created when you save.':'New medicine. It will be added to the item list and to Medication when you save.';
    if(!known){var gs=guess(v),st=row.querySelector('[data-f=strength]'),un=row.querySelector('[data-f=unit]'),mr=M[+t.dataset.i];
      if(gs){if(!st.value){st.value=gs.s;mr.strength=gs.s}if(!un.value){un.value=gs.u;mr.unit=gs.u}}}
    if(MF[v]&&sel&&!sel.value){sel.value=MF[v];M[+t.dataset.i].form=MF[v]}
  }
};
$('#add-med').onclick=function(){M.push(blankMed());renderMeds()};

function bmi(){
  var h=parseFloat($('#v-height').value),w=parseFloat($('#v-weight').value);
  $('#v-bmi').value=(h>0&&w>0)?(w/Math.pow(h/100,2)).toFixed(1):''
}
$('#v-height').oninput=$('#v-weight').oninput=bmi;

function vitals(){var o={};VK.forEach(function(k){o[k]=$('#v-'+k).value});return o}
function payload(complete){
  return {appointment:A,patient:P,practitioner:D,comment:$('#notes').value,complete:complete?'1':'0',amend:amend?'1':'0',
    symptoms:JSON.stringify(T.sym),diagnosis:JSON.stringify(T.dx),labs:JSON.stringify(T.lab),
    drugs:JSON.stringify(M.filter(function(m){return m.drug.trim()})),vitals:JSON.stringify(vitals())}
}

function init(r){
  csrf=r.csrf||'';P=r.patient.id;D=r.practitioner||D;L=r.lists||{};
  ['complaints','diagnoses','medications','items','forms','classes','uoms','dosages','periods','labs'].forEach(function(k){L[k]=L[k]||[]});MF=r.med_forms||{};
  var p=r.patient,words=(p.name||'').split(/\s+/);
  $('#av').textContent=((words[0]||'?')[0]+(words[1]?words[1][0]:'')).toUpperCase();
  $('#pn').textContent=p.name;
  $('#pm').textContent=['Age '+(p.age==null?'not recorded':p.age),p.sex,p.mobile?'Mobile '+p.mobile:''].filter(Boolean).join('   ');
  if(r.appointment){$('#ap').innerHTML='<b>'+esc(fmt(r.appointment.time))+'</b>'+esc(r.appointment.type||'')}
  fill('dl-sym',L.complaints);fill('dl-dx',L.diagnoses);fill('dl-med',L.medications.concat(L.items));fill('dl-lab',L.labs);fill('dl-uom',L.uoms);
  if(!(L.medications.length+L.items.length))$('#med-hint').textContent='No medicines saved yet. Type a medicine name to add a new one.';
  var e=r.encounter;
  if(e){T.sym=e.symptoms||[];T.dx=e.diagnosis||[];T.lab=e.labs||[];M=e.drugs||[];$('#notes').value=e.comment||''}
  if(r.vitals){VK.forEach(function(k){if(r.vitals[k])$('#v-'+k).value=r.vitals[k]});bmi()}
  ['sym','dx','lab'].forEach(renderTags);renderMeds();
  $('#hx').innerHTML=(r.history||[]).length?r.history.map(function(h){
    var op=(h.appointment&&h.appointment!==A)?' <a href="'+location.pathname+'?appointment='+encodeURIComponent(h.appointment)+'&patient='+encodeURIComponent(P)+'&practitioner='+encodeURIComponent(D)+'" target="_blank" rel="noopener">Open to view or edit</a>':'';
    return '<div class="hx"><b>'+esc(h.date)+(h.diagnosis.length?'  '+esc(h.diagnosis.join(', ')):'')+'</b>'+esc(h.comment)+op+'</div>'}).join(''):'<p class="hint">No earlier completed visits.</p>';
  $('#form').hidden=false;
  if(e&&e.docstatus===1){
    amend=true;
    VK.forEach(function(k){$('#v-'+k).disabled=true});
    $('#draft').hidden=true;$('#complete').textContent='Save changes';
    $('.acts').insertAdjacentHTML('beforeend','<a class="pb" style="flex:none" href="'+pu(e.name)+'" target="_blank" rel="noopener">Print encounter</a>');
    msg('This consultation is completed. Change anything below and press Save changes: the original is cancelled and the corrected one is saved. Vitals stay as recorded.',true)}
}

function learn(){
  T.sym.forEach(function(v){if(L.complaints.indexOf(v)<0)L.complaints.push(v)});
  T.dx.forEach(function(v){if(L.diagnoses.indexOf(v)<0)L.diagnoses.push(v)});
  M.forEach(function(m){var v=m.drug.trim();if(v&&L.medications.indexOf(v)<0)L.medications.push(v);var k=L.items.indexOf(v);if(k>-1)L.items.splice(k,1)});
  fill('dl-sym',L.complaints);fill('dl-dx',L.diagnoses);fill('dl-med',L.medications.concat(L.items));
  renderTags('sym');renderTags('dx');renderMeds()
}
function save(complete){
  if(complete&&!window.confirm(amend?'Save these changes? The completed consultation is cancelled and replaced by the corrected one.':'Complete this consultation? It will be submitted and the appointment closed.'))return;
  var b1=$('#draft'),b2=$('#complete');b1.disabled=b2.disabled=true;msg('');
  call('enc_save',payload(complete),true).then(function(r){
    if(r.completed){
      $('#form').hidden=true;var d=$('#done');d.hidden=false;
      d.innerHTML='<b>Consultation completed.</b><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px"><a class="pb" href="'+pu(r.encounter)+'" target="_blank" rel="noopener">Print encounter</a><a href="/doctor-desk">Back to doctor desk</a><a href="/app/patient-encounter/'+encodeURIComponent(r.encounter)+'" target="_blank" rel="noopener">View in Desk</a></div>'
    }else{learn();msg('Draft saved.',true)}
  }).catch(function(e){msg(e.message)}).then(function(){b1.disabled=b2.disabled=false})
}
$('#draft').onclick=function(){save(false)};
$('#complete').onclick=function(){save(true)};

if(!A&&!P){$('#pn').textContent='No patient selected';msg('Open this page with the Start consultation button on the doctor desk.')}
else call('enc_load',{appointment:A,patient:P}).then(init).catch(function(e){$('#pn').textContent='Could not open consultation';msg(e.message)});
})();
</script>
</div>
