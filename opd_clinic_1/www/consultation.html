<!-- title: Consultation -->
<div id="en">
<style>
html,body{height:auto!important;min-height:100%!important;overflow-y:auto!important}
#en{
  --ink:#11281e;
  --mute:#546a5f;
  --line:#cfe0d7;
  --bg:#f4f9f6;
  --brand:#125c3a;
  --brand-dark:#0d3d27;
  --ok:#125c3a;
  --err:#c0392b;
  --gold:#f1c40f;
  --gold-text:#966f00;
  --gold-bg:#fffbe6;
  --shadow-sm:0 2px 10px rgba(18,92,58,0.06);
  display:flex;
  flex-direction:column;
  gap:12px;
  box-sizing:border-box;
  min-height:100vh;
  height:auto!important;
  max-width:1880px;
  margin:0 auto;
  padding:10px 12px 64px;
  color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:visible!important;
}
.web-footer,body>footer{display:none!important}
#en *{box-sizing:border-box}

#en a.back{
  color:#f1c40f;
  font-weight:700;
  text-decoration:none;
  font-size:.9rem;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
#en a.back:hover{text-decoration:underline}

#en .pt{
  flex:none;
  display:flex;
  gap:14px;
  align-items:center;
  padding:12px 18px;
  border-radius:14px;
  background:linear-gradient(135deg,#0d3d27 0%,#125c3a 100%);
  color:#fff;
  box-shadow:var(--shadow-sm);
}
#en .av{
  flex:none;
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,#f1c40f,#d4ac0d);
  color:#2b1d00;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:1.1rem;
}
#en h1,#en #pn{font-size:1.3rem;margin:0;line-height:1.2;color:#ffffff !important;font-weight:800}
#en .pt p,#en #pm{margin:2px 0 0;font-size:.88rem;color:#d8efe4 !important;opacity:1}
#en .pt .ap{margin-left:auto;text-align:right;font-size:.85rem;color:#fff}
#en .pt .ap b{display:block;font-size:1.05rem;color:#f1c40f}

#en h2{font-size:1rem;font-weight:800;color:var(--brand);margin:0 0 10px}
#en .card{
  padding:14px 16px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  box-shadow:var(--shadow-sm);
}
#en label{display:block;font-size:.78rem;font-weight:700;margin:0 0 3px;color:var(--mute)}
#en input,#en select,#en textarea{
  width:100%;
  padding:8px 10px;
  border:1.5px solid var(--line);
  border-radius:8px;
  font:inherit;
  color:var(--ink);
  background:#fff;
}
#en input:focus,#en select:focus,#en textarea:focus,#en button:focus-visible{
  outline:3px solid #8cc9b5;
  outline-offset:1px;
  border-color:var(--brand);
}

#en #form{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
#en #sec-hx{grid-column:1/-1;background:#f9fcfb}
#en #sec-vitals{grid-column:1/-1}
#en #sec-sym{grid-column:1}
#en #sec-dx{grid-column:2}
#en #sec-meds{grid-column:1/-1}
#en #sec-lab{grid-column:1}
#en #sec-notes{grid-column:2}
#en #acts{grid-column:1/-1}

#en .hx-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#en .hx-head h2{margin:0;font-size:1rem}
#en #hx{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto}
#en .hx-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:.88rem}
#en .hx-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#en a.hx-date{font-weight:800;color:var(--brand);text-decoration:none;border-bottom:1.5px solid #8cc9b5}
#en a.hx-date:hover{color:var(--brand-dark)}
#en .hx-dx{background:var(--bg);color:var(--ok);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.82rem;border:1px solid var(--line)}
#en .hx-note{color:var(--mute);font-size:.84rem}
#en .hx-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
#en .hx-btn{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:.8rem;font-weight:700;text-decoration:none}
#en .hx-btn:hover{background:var(--bg);border-color:var(--brand)}

#en .vg{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
#en .tags{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;padding:6px;min-height:58px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
#en .tags input{flex:1 1 130px;border:0;padding:4px;min-width:0}
#en .tags input:focus{outline:none}
#en .tags:focus-within{outline:3px solid #8cc9b5}
#en .chip{display:inline-flex;gap:4px;align-items:center;padding:3px 4px 3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.88rem;font-weight:600}
#en .chip.new{border-style:dashed;color:var(--brand)}
#en .chip button{border:0;background:none;color:var(--mute);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 6px}

#en .meds{display:flex;flex-direction:column;gap:10px}
#en #meds{display:flex;flex-direction:column;gap:8px}
#en .med{background:#fafcfb;border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
#en .med-row{display:grid;grid-template-columns:minmax(180px,2.4fr) 115px 115px 115px minmax(140px,1.8fr) auto;gap:8px;align-items:end}
#en .med button.rm{height:36px;padding:0 14px;border:1.5px solid var(--err);background:#fff;color:var(--err);border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
#en .med button.rm:hover{background:var(--err);color:#fff}
#en .nn{padding:8px 0 2px;margin-top:2px;border-top:1px dashed var(--line)}
#en .nn .hint{margin:0 0 6px;font-size:.82rem;color:var(--mute);display:block}
#en .nn-fields{display:grid;grid-template-columns:minmax(180px,1.5fr) 120px 120px;gap:8px;max-width:600px;align-items:end}
#en .mf{display:flex;gap:10px;align-items:center;padding-top:4px}
#en button.sm{padding:7px 14px;border:1.5px solid var(--brand);border-radius:8px;background:#fff;color:var(--brand);font:inherit;font-weight:700;cursor:pointer}
#en button.sm:hover{background:var(--bg)}
#en .hint{color:var(--mute);font-size:.85rem;margin:0}

#en #notes{min-height:58px;resize:vertical}

#en .acts{display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:18px 0 32px;margin-top:4px;border-top:1.5px solid var(--line)}
#en .acts button,#en .acts a.pb{padding:12px 24px;border-radius:10px;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#en .acts button{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
#en .acts button:hover{background:var(--bg);border-color:var(--brand)}
#en .acts button.go,#en .acts a.pb{
  background:linear-gradient(135deg,#125c3a,#0d3d27);
  border:none;
  color:#fff;
  box-shadow:0 3px 12px rgba(18,92,58,0.25);
}
#en .acts button.go:hover,#en .acts a.pb:hover{filter:brightness(1.1)}
#en .acts button:disabled{opacity:.55;cursor:wait}

#en .note{padding:10px 14px;border-radius:8px;background:var(--bg);border-left:4px solid var(--ok);font-size:.92rem}
#en .note.bad{border-color:var(--err);background:#fdf2f2;color:var(--err)}
#en [hidden]{display:none!important}

@media(max-width:960px){
  #en #form{grid-template-columns:1fr}
  #en #sec-sym,#en #sec-dx,#en #sec-lab,#en #sec-notes{grid-column:1}
  #en .vg{grid-template-columns:repeat(4,1fr)}
  #en .med-row{grid-template-columns:1fr 1fr}
  #en .med-row>div:first-child,#en .med-row>div:nth-child(5){grid-column:1/-1}
}
@media(max-width:540px){
  #en .vg{grid-template-columns:repeat(2,1fr)}
  #en .pt{flex-wrap:wrap;gap:8px}
  #en .pt .ap{margin-left:0;text-align:left;width:100%;border-top:1px solid rgba(255,255,255,0.2);padding-top:6px;margin-top:4px}
  #en .acts{justify-content:stretch;flex-direction:column}
  #en .acts button,#en .acts a.pb{width:100%}
}
</style>

<datalist id="dl-sym"></datalist><datalist id="dl-dx"></datalist><datalist id="dl-med"></datalist><datalist id="dl-lab"></datalist><datalist id="dl-uom"></datalist>

<header class="pt">
  <a class="back" href="/doctor-desk">&larr; Doctor desk</a>
  <div class="av" id="av">&middot;</div>
  <div><h1 id="pn">Loading&hellip;</h1><p id="pm"></p></div>
  <div class="ap" id="ap"></div>
</header>
<div id="msg" class="note bad" role="alert" hidden></div>

<div id="form" hidden>
  <section class="card hist" id="sec-hx">
    <div class="hx-head">
      <h2>Previous visits</h2>
    </div>
    <div id="hx"></div>
  </section>

  <section class="card" id="sec-cdate" hidden style="grid-column:1/-1;background:#fffbe6;border-color:#f7dc6f;padding:10px 14px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <b style="color:#966f00;font-size:.9rem">Consultation Date (Admin Backlog Mode)</b>
        <span style="display:block;font-size:.78rem;color:#7d5d00">Defaults to appointment date; edit only if recording a backdated entry.</span>
      </div>
      <input type="date" id="c-date" style="width:auto;min-width:165px;padding:7px 10px;border:1.5px solid #cfe0d7;border-radius:8px;font:inherit;background:#fff">
    </div>
  </section>

  <section class="card" id="sec-vitals" style="grid-column:1/-1;background:#f8faf9;padding:10px 14px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b style="color:var(--ok);font-size:.9rem">Vitals:</b>
        <span id="vitals-display" style="font-size:.88rem">Not recorded</span>
      </div>
      <a class="hx-btn" id="vitals-link" href="#" target="_blank" rel="noopener">Record / Edit Vitals &#8599;</a>
    </div>
  </section>

  <section class="card" id="sec-sym">
    <h2>Complaints</h2>
    <div class="tags" id="tg-sym"><input id="in-sym" list="dl-sym" placeholder="Type and press Enter (new ones are added)" aria-label="Add complaint"></div>
  </section>

  <section class="card" id="sec-dx">
    <h2>Diagnosis</h2>
    <div class="tags" id="tg-dx"><input id="in-dx" list="dl-dx" placeholder="Type and press Enter (new ones are added)" aria-label="Add diagnosis"></div>
  </section>

  <section class="card meds" id="sec-meds">
    <h2>Medicines</h2>
    <div id="meds"></div>
    <div class="mf"><button type="button" class="sm" id="add-med">+ Add medicine</button><span class="hint" id="med-hint"></span></div>
  </section>

  <section class="card" id="sec-lab">
    <h2>Lab tests</h2>
    <div class="tags" id="tg-lab"><input id="in-lab" list="dl-lab" placeholder="Type and press Enter" aria-label="Add lab test"></div>
  </section>

  <section class="card" id="sec-notes">
    <h2>Notes</h2>
    <textarea id="notes" rows="3" aria-label="Consultation notes" placeholder="Examination findings, advice, follow-up"></textarea>
  </section>

  <div class="acts" id="acts">
    <button type="button" id="draft">Save draft</button>
    <button type="button" class="go" id="complete">Complete consultation</button>
    <a class="pb" id="print-btn" href="#" target="_blank" rel="noopener" hidden>Print encounter</a>
  </div>
</div>

<div id="done" class="note" hidden></div>

<script>
(function(){
var $=function(s){return document.querySelector('#en '+s)};
var q=new URLSearchParams(location.search),A=q.get('appointment')||'',P=q.get('patient')||'',D=q.get('practitioner')||'',E=q.get('encounter')||'';
var amend=false,csrf='',T={sym:[],dx:[],lab:[]},M=[],L={},MF={},NEW={sym:'complaints',dx:'diagnoses'};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(t){var p=String(t).split(':'),h=+p[0],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
function pu(n){return '/printview?doctype=Patient%20Encounter&name='+encodeURIComponent(n)+'&trigger_print=1'}
function msg(t,ok){var e=$('#msg');e.textContent=t||'';e.className='note'+(ok?'':' bad');e.hidden=!t;if(t)e.scrollIntoView({block:'nearest'})}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){var t='Something went wrong. Please try again.';
        try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message.replace(/<[^>]+>/g,'')}catch(e){}
        if(t==='Something went wrong. Please try again.'){
          if(j.exc_type)t=j.exc_type+(j.exception?': '+j.exception:'');
          else if(j.exception)t=j.exception;
          else if(j.message)t=j.message;
        }
        if(/invalid request/i.test(t))t='Your session expired. Refresh the page and try again.';
        throw new Error(t)}
      return j.message})})
}

function fill(id,arr){$('#'+id).innerHTML=(arr||[]).map(function(v){return '<option value="'+esc(v)+'">'}).join('')}

function renderTags(k){
  var box=$('#tg-'+k),inp=$('#in-'+k);
  box.querySelectorAll('.chip').forEach(function(c){c.remove()});
  T[k].forEach(function(v,i){var c=document.createElement('span');c.className='chip'+(NEW[k]&&(L[NEW[k]]||[]).indexOf(v)<0?' new':'');
    c.innerHTML=esc(v)+'<button type="button" aria-label="Remove '+esc(v)+'" data-k="'+k+'" data-i="'+i+'">&times;</button>';
    box.insertBefore(c,inp)})
}
function addTag(k,v){v=(v||'').trim();if(!v||T[k].indexOf(v)>-1)return;T[k].push(v);renderTags(k)}
['sym','dx','lab'].forEach(function(k){
  var inp=$('#in-'+k);
  inp.onkeydown=function(e){if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(k,inp.value);inp.value=''}};
  inp.onchange=function(){addTag(k,inp.value);inp.value=''};
  inp.onblur=function(){if(inp.value.trim()){addTag(k,inp.value);inp.value=''}}
});
$('#form').onclick=function(e){
  var b=e.target.closest('.chip button');
  if(b){T[b.dataset.k].splice(+b.dataset.i,1);renderTags(b.dataset.k);return}
  var r=e.target.closest('button[data-rm]');
  if(r){M.splice(+r.dataset.rm,1);renderMeds()}
};

function opts(list,cur,ph){return '<option value="">'+ph+'</option>'+list.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function guess(v){
  var m=v.match(/(\d+(?:\.\d+)?)\s*(mcg|mg|ml|iu|g|%)(?![a-z])/i);if(!m)return null;
  var al={mg:['mg','Milligram'],mcg:['mcg','Microgram'],g:['g','Gram'],ml:['ml','Millilitre','Milliliter'],iu:['IU'],'%':['%','Percent']}[m[2].toLowerCase()],u=m[2].toLowerCase();
  for(var i=0;i<al.length;i++){var f=L.uoms.filter(function(x){return x.toLowerCase()===al[i].toLowerCase()})[0];if(f){u=f;break}}
  return {s:m[1],u:u}
}
function blankMed(){return {drug:'',form:'',mclass:'',strength:'',unit:'',dosage:'',period:'',comment:''}}
function renderMeds(){
  var box=$('#meds');
  if(!M.length)M.push(blankMed());
  box.innerHTML=M.map(function(m,i){
    var isNew=m.drug.trim()&&L.medications.indexOf(m.drug.trim())<0;
    return '<div class="med">'+
      '<div class="med-row">'+
        '<div><label>Medicine</label><input list="dl-med" data-i="'+i+'" data-f="drug" value="'+esc(m.drug)+'" placeholder="Search, or type a new medicine"></div>'+
        '<div><label>Form</label><select data-i="'+i+'" data-f="form">'+opts(L.forms,m.form,'Select')+'</select></div>'+
        '<div><label>Dosage</label><select data-i="'+i+'" data-f="dosage">'+opts(L.dosages,m.dosage,'Select')+'</select></div>'+
        '<div><label>Duration</label><select data-i="'+i+'" data-f="period">'+opts(L.periods,m.period,'Select')+'</select></div>'+
        '<div><label>Instructions</label><input data-i="'+i+'" data-f="comment" value="'+esc(m.comment)+'" placeholder="For example after food" aria-label="Instructions"></div>'+
        '<div><label>&nbsp;</label><button type="button" class="rm" data-rm="'+i+'">Remove</button></div>'+
      '</div>'+
      '<div class="nn"'+(isNew?'':' hidden')+'><span class="hint">'+(L.items.indexOf(m.drug.trim())>-1?'Pharmacy item with no Medication record yet. One will be created when you save.':'New medicine. It will be added to the item list and to Medication when you save.')+'</span>'+
      '<div class="nn-fields">'+
        '<div><label>Medication class</label><select data-i="'+i+'" data-f="mclass">'+opts(L.classes,m.mclass,'Choose automatically')+'</select></div>'+
        '<div><label>Strength</label><input type="number" step="any" inputmode="decimal" data-i="'+i+'" data-f="strength" value="'+esc(m.strength)+'" placeholder="10"></div>'+
        '<div><label>Unit</label><input list="dl-uom" data-i="'+i+'" data-f="unit" value="'+esc(m.unit)+'" placeholder="mg"></div>'+
      '</div></div></div>'
  }).join('')
}
$('#meds').oninput=$('#meds').onchange=function(e){
  var t=e.target;if(!t.dataset.f)return;
  M[+t.dataset.i][t.dataset.f]=t.value;
  if(t.dataset.f==='drug'){
    var row=t.closest('.med'),v=t.value.trim(),sel=row.querySelector('select[data-f=form]');
    var known=!v||L.medications.indexOf(v)>-1;
    row.querySelector('.nn').hidden=known;
    row.querySelector('.nn .hint').textContent=L.items.indexOf(v)>-1?'Pharmacy item with no Medication record yet. One will be created when you save.':'New medicine. It will be added to the item list and to Medication when you save.';
    if(!known){var gs=guess(v),st=row.querySelector('[data-f=strength]'),un=row.querySelector('[data-f=unit]'),mr=M[+t.dataset.i];
      if(gs){if(!st.value){st.value=gs.s;mr.strength=gs.s}if(!un.value){un.value=gs.u;mr.unit=gs.u}}}
    if(MF[v]&&sel&&!sel.value){sel.value=MF[v];M[+t.dataset.i].form=MF[v]}
  }
};
$('#add-med').onclick=function(){M.push(blankMed());renderMeds()};

function payload(complete){
  var o={appointment:A,patient:P,practitioner:D,comment:$('#notes').value,complete:complete?'1':'0',amend:amend?'1':'0',
    symptoms:JSON.stringify(T.sym),diagnosis:JSON.stringify(T.dx),labs:JSON.stringify(T.lab),
    drugs:JSON.stringify(M.filter(function(m){return m.drug.trim()})),vitals:'{}'};
  if($('#c-date') && !$('#sec-cdate').hidden && $('#c-date').value){
    o.encounter_date=$('#c-date').value;
  }
  return o;
}

function init(r){
  csrf=r.csrf||'';P=r.patient.id;D=r.practitioner||D;L=r.lists||{};
  var isAdmin=!!r.is_admin, serverToday=r.today||'';
  ['complaints','diagnoses','medications','items','forms','classes','uoms','dosages','periods','labs'].forEach(function(k){L[k]=L[k]||[]});MF=r.med_forms||{};
  var p=r.patient,words=(p.name||'').split(/\s+/);
  $('#av').textContent=((words[0]||'?')[0]+(words[1]?words[1][0]:'')).toUpperCase();
  var uidStr = (p.uid && p.uid !== p.name) ? p.uid : '';
  $('#pn').innerHTML = esc(p.name) + (uidStr ? ' <span style="font-size:0.92rem;font-weight:600;color:#8cc9b5;letter-spacing:0.3px">(' + esc(uidStr) + ')</span>' : '');
  $('#pm').textContent=['Age '+(p.age==null?'not recorded':p.age),p.sex,p.mobile?'Mobile '+p.mobile:''].filter(Boolean).join('   ');
  if(r.appointment){$('#ap').innerHTML='<b>'+(r.appointment.date?esc(r.appointment.date)+' &middot; ':'')+esc(fmt(r.appointment.time))+'</b>'+esc(r.appointment.type||'')}
  fill('dl-sym',L.complaints);fill('dl-dx',L.diagnoses);fill('dl-med',L.medications.concat(L.items));fill('dl-lab',L.labs);fill('dl-uom',L.uoms);
  if(!(L.medications.length+L.items.length))$('#med-hint').textContent='No medicines saved yet. Type a medicine name to add a new one.';
  var e=r.encounter;
  if(e){window.currentEncounter=e.name;T.sym=e.symptoms||[];T.dx=e.diagnosis||[];T.lab=e.labs||[];M=e.drugs||[];$('#notes').value=e.comment||''}
  var targetDate=(e&&e.date)||(r.appointment&&r.appointment.date)||serverToday;
  if(isAdmin && $('#sec-cdate')){
    $('#sec-cdate').hidden=false;
    if($('#c-date')) $('#c-date').value=targetDate||serverToday;
  }
  var vitLink='/vitals?'+(A?'appointment='+encodeURIComponent(A)+'&':'')+'patient='+encodeURIComponent(P)+(D?'&practitioner='+encodeURIComponent(D):'');
  $('#vitals-link').href=vitLink;
  if(r.vitals){
    var v=r.vitals,parts=[];
    if(v.bp_systolic||v.bp_diastolic)parts.push('BP: '+(v.bp_systolic||'-')+'/'+(v.bp_diastolic||'-')+' mmHg');
    if(v.pulse)parts.push('Pulse: '+v.pulse+'/min');
    if(v.temperature)parts.push('Temp: '+v.temperature+' \u00B0F');
    if(v.respiratory_rate)parts.push('Resp: '+v.respiratory_rate+'/min');
    if(v.weight)parts.push('Wt: '+v.weight+' kg');
    if(v.height)parts.push('Ht: '+v.height+' cm');
    if(v.bmi)parts.push('BMI: '+v.bmi);
    if(parts.length){
      $('#vitals-display').innerHTML='<strong>'+parts.join(' &nbsp;|&nbsp; ')+'</strong>';
    }else{
      $('#vitals-display').textContent='Not recorded for this visit';
    }
  }else{
    $('#vitals-display').textContent='Not recorded for this visit';
  }
  ['sym','dx','lab'].forEach(renderTags);renderMeds();

  var curEncId = (e && e.name) || E || window.currentEncounter || '';
  var hxList = (r.history || []).filter(function(h){
    var hEnc = h.encounter || h.name || '';
    if(curEncId && hEnc && hEnc === curEncId) return false;
    if(A && h.appointment && h.appointment === A) return false;
    return true;
  });
  $('#hx').innerHTML = hxList.length ? hxList.map(function(h){
    var encName = h.encounter || h.name || '';
    var consUrl = '/consultation?' + (encName ? 'encounter=' + encodeURIComponent(encName) + '&' : '') +
                  (h.appointment ? 'appointment=' + encodeURIComponent(h.appointment) + '&' : '') +
                  'patient=' + encodeURIComponent(P) + '&practitioner=' + encodeURIComponent(D);
    var deskUrl = encName ? '/app/patient-encounter/' + encodeURIComponent(encName) : '';
    var printUrl = encName ? pu(encName) : '';
    var dxText = (h.diagnosis && h.diagnosis.length) ? h.diagnosis.join(', ') : '';

    return '<div class="hx-row">' +
      '<div class="hx-info">' +
        '<a class="hx-date" href="' + consUrl + '" target="_blank" rel="noopener" title="Open consultation in new tab">' +
          esc(h.date) +
        '</a>' +
        (dxText ? '<span class="hx-dx">' + esc(dxText) + '</span>' : '') +
        (h.comment ? '<span class="hx-note">' + esc(h.comment) + '</span>' : '') +
      '</div>' +
      '<div class="hx-actions">' +
        (encName ? '<a class="hx-btn" href="' + consUrl + '" target="_blank" rel="noopener" title="Open consultation in new tab">Open ↗</a>' : '') +
        (encName ? '<a class="hx-btn" href="' + deskUrl + '" target="_blank" rel="noopener" title="View Patient Encounter in Desk">' + esc(encName) + ' ↗</a>' : '') +
        (encName ? '<a class="hx-btn" href="' + printUrl + '" target="_blank" rel="noopener" title="Print encounter">Print 🖶</a>' : '') +
      '</div>' +
    '</div>';
  }).join('') : '<p class="hint">No earlier completed visits.</p>';

  $('#form').hidden=false;
  if(e&&e.docstatus===1){
    amend=true;
    $('#draft').hidden=true;
    $('#complete').textContent='Save changes';
    var pb=$('#print-btn');
    pb.href=pu(e.name);
    pb.hidden=false;
    msg('This consultation is completed. Change anything below and press Save changes: the original is cancelled and the corrected one is saved. Vitals stay as recorded.',true)}
  var isPastReadOnly = !isAdmin && serverToday && targetDate && targetDate < serverToday;
  if(isPastReadOnly){
    $('#draft').hidden=true;
    $('#complete').hidden=true;
    $('#add-med').hidden=true;
    $('#notes').readOnly=true;
    msg('Past-dated consultations are read-only. Only admin accounts can modify backlog entries.');
  }
}

function learn(){
  T.sym.forEach(function(v){if(L.complaints.indexOf(v)<0)L.complaints.push(v)});
  T.dx.forEach(function(v){if(L.diagnoses.indexOf(v)<0)L.diagnoses.push(v)});
  M.forEach(function(m){var v=m.drug.trim();if(v&&L.medications.indexOf(v)<0)L.medications.push(v);var k=L.items.indexOf(v);if(k>-1)L.items.splice(k,1)});
  fill('dl-sym',L.complaints);fill('dl-dx',L.diagnoses);fill('dl-med',L.medications.concat(L.items));
  renderTags('sym');renderTags('dx');renderMeds()
}
function save(complete){
  if(complete&&!window.confirm(amend?'Save these changes? The completed consultation is cancelled and replaced by the corrected one.':'Complete this consultation? It will be submitted and the appointment closed.'))return;
  var b1=$('#draft'),b2=$('#complete');b1.disabled=b2.disabled=true;msg('');
  var endpoint = amend ? 'enc_amend' : 'enc_save';
  var data = payload(complete);
  if(amend && window.currentEncounter){ data.encounter = window.currentEncounter; }
  call(endpoint, data, true).then(function(r){
    if(r.completed){
      $('#form').hidden=true;var d=$('#done');d.hidden=false;
      d.innerHTML='<b>Consultation completed.</b><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px"><a class="pb" href="'+pu(r.encounter)+'" target="_blank" rel="noopener">Print encounter</a><a href="/doctor-desk">Back to doctor desk</a><a href="/app/patient-encounter/'+encodeURIComponent(r.encounter)+'" target="_blank" rel="noopener">View in Desk</a></div>'
    }else{learn();msg(amend ? 'Changes saved.' : 'Draft saved.',true)}
  }).catch(function(e){msg(e.message)}).then(function(){b1.disabled=b2.disabled=false})
}
$('#draft').onclick=function(){save(false)};
$('#complete').onclick=function(){save(true)};

if(!A&&!P&&!E){$('#pn').textContent='No patient selected';msg('Open this page with the Start consultation button on the doctor desk.')}
else call('enc_load',{appointment:A,patient:P,encounter:E}).then(init).catch(function(e){$('#pn').textContent='Could not open consultation';msg(e.message)});
})();
</script>
</div>
