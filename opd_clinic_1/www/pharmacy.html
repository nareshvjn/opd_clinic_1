<!-- title: Pharmacy New -->
<div id="ph">
<script>
(function(){
  var _f = window.fetch;
  window.fetch = function(url, opts){
    return _f(url, opts).then(function(r){
      if(!r.ok && String(url).indexOf('/api/method/')!==-1){
        r.clone().json().then(function(j){
          var t='';
          try{t=JSON.parse(JSON.parse(j._server_messages)[0]).message;}catch(e){}
          if(/invalid request|not logged in/i.test(t)||r.status===403)
            window.location.replace('/login?redirect-to='+encodeURIComponent(location.pathname+location.search));
        }).catch(function(){});
      }
      return r;
    });
  };
})();
</script>
<script>
  function s(t){var d=document.createElement('div');d.style.cssText='padding:10px;margin:8px 0;background:#fdf0ef;color:#b3261e;border-left:4px solid #b3261e;font:14px system-ui;word-break:break-word';d.textContent=t;var p=document.getElementById('ph');p.insertBefore(d,p.firstChild)}
  window.addEventListener('error',function(e){if(e.filename&&e.filename.indexOf('bundle')<0&&e.filename.indexOf('website_script')<0)s('Error: '+e.message+' (line '+e.lineno+':'+e.colno+')')});
</script>

<script>
(function(){
var $=function(s){return document.querySelector('#ph '+s)};
var csrf='',wh='';
var ls={rows:[],cur:null,open:null,total:0};

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function n(v){v=parseFloat(v);return isNaN(v)?0:v}
function inr(v){return '\u20B9'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mmyy(d){if(!d)return '-';var p=d.split('-');return p[1]+'/'+p[0].slice(2)}
function fmtDate(d){if(!d)return '-';var p=(d||'').slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function qtyText(q,u){u=u||1;var pk=Math.floor(q/u+1e-9),ls=Math.round(q-pk*u);return pk+' Pack'+(pk===1?'':'s')+', '+ls+' Unit'+(ls===1?'':'s')}
function toast(t,bad){var e=$('#toast');e.textContent=t||'';e.className=bad?'bad':'';e.hidden=!t;if(t)e.scrollIntoView({block:'nearest'})}
function debounce(fn){var t;return function(){clearTimeout(t);t=setTimeout(fn,250)}}

function call(method,params,post){
  var p=new URLSearchParams(params||{}),o={headers:{Accept:'application/json'}};
  if(post){o.method='POST';o.body=p;var t=csrf||(window.frappe&&frappe.csrf_token)||window.csrf_token;if(t)o.headers['X-Frappe-CSRF-Token']=t}
  return fetch('/api/method/'+method+(post?'':'?'+p),o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){
        var t='Something went wrong. Please try again.';
        try{var msgs=JSON.parse(j._server_messages);var last=JSON.parse(msgs[msgs.length-1]);t=(last.message||last).replace(/<[^>]+>/g,'')}catch(e){}
        if(t==='Something went wrong. Please try again.'){
          if(j.exc_type)t=j.exc_type+(j.exception?': '+j.exception:'');
          else if(j.exception)t=j.exception;
          else if(j.message)t=j.message;
        }
        if(/invalid request|not logged in/i.test(t)){window.location.replace('/login?redirect-to='+encodeURIComponent(window.location.pathname));return}
        throw new Error(t);
      }
      return j.message})})
}

// Tab switcher
document.querySelectorAll('#ph .tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#ph .tabs button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))});
    ['sale','purchase','list'].forEach(function(t){$('#t-'+t).hidden=(t!==b.dataset.t)});
    toast('');
    if(b.dataset.t==='list'&&!ls.rows.length) loadList();
    if(b.dataset.t==='sale'&&!$('#sl-list').innerHTML) $('#sl-date-search').click();
    if(b.dataset.t==='purchase'&&!$('#pu-list').innerHTML) $('#pu-date-search').click();
  }
});

// Hash anchor handler (#sale, #purchase, #list)
var h=(location.hash||'').replace('#','');
if(h==='sale'||h==='purchase'||h==='list'){
  var btn=document.querySelector('#ph .tabs button[data-t="'+h+'"]');
  if(btn) btn.click();
}

call('ph_meta').then(function(m){
  csrf=m.csrf||'';wh=m.warehouse||'';
  $('#wh').innerHTML=m.warehouses.map(function(w){return '<option'+(w===wh?' selected':'')+'>'+esc(w)+'</option>'}).join('');
  if(!m.warehouses.length) toast('No store (warehouse) found. Create one in Desk first.',1);
  $('#sl-date-search').click();
}).catch(function(e){toast(e.message,1)});

$('#wh').onchange=function(){wh=this.value;loadList()};

// ==========================
// SALES SECTION (BY DATE)
// ==========================
function updateSaleDateFmt(){
  var v=$('#sl-date').value;
  $('#sl-date-fmt').textContent=v ? 'Selected: '+fmtDate(v) : '';
}

function shiftSaleDate(days){
  var cur=$('#sl-date').value ? new Date($('#sl-date').value) : new Date();
  if(isNaN(cur.getTime())) cur=new Date();
  cur.setDate(cur.getDate()+days);
  $('#sl-date').value=cur.toISOString().slice(0,10);
  updateSaleDateFmt();
  $('#sl-date-search').click();
}

$('#sl-date').value=new Date().toISOString().slice(0,10);
updateSaleDateFmt();
$('#sl-date').onchange=updateSaleDateFmt;
$('#sl-date-prev').onclick=function(){shiftSaleDate(-1)};
$('#sl-date-next').onclick=function(){shiftSaleDate(1)};

$('#sl-date-search').onclick=function(){
  var d=$('#sl-date').value;
  if(!d){toast('Pick a date first.',1);return}
  var b=this;b.disabled=true;
  $('#sl-list').innerHTML='<p class="hint">Loading sales...</p>';
  call('sr_list',{date:d}).then(function(r){
    if(!r.invoices.length){
      $('#sl-list').innerHTML='<p class="hint">No sales invoices on '+fmtDate(d)+'.</p>';
      return;
    }
    var total=0;r.invoices.forEach(function(x){total+=n(x.total)});
    var summary='<div class="sum" style="font-weight:700;margin-bottom:10px"><span>'+r.invoices.length+' invoice(s) / returns</span><b>Total: '+inr(total)+'</b></div>';
    var rows=r.invoices.map(function(iv){
      var badge=iv.is_return?'<span class="badge-return">Return Note</span>':'';
      return '<div class="inv-row">'+
        '<div>'+
          '<b>'+esc(iv.name)+badge+'</b>'+
          '<span>'+esc(iv.customer)+(iv.time?' &nbsp;&middot;&nbsp; '+esc(iv.time):'')+'</span>'+
        '</div>'+
        '<div class="r" style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">'+
          '<div class="inv-total">'+inr(iv.total)+'</div>'+
          '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">'+
            '<a class="btn sm subtle" href="/printview?doctype=Sales%20Invoice&name='+encodeURIComponent(iv.name)+'&trigger_print=1" target="_blank" rel="noopener">Print</a>'+
            (iv.is_return?'':'<button type="button" class="btn sm" data-edit-sale="'+esc(iv.name)+'">Edit</button>')+
            '<a class="btn sm subtle" href="/app/sales-invoice/'+encodeURIComponent(iv.name)+'" target="_blank" rel="noopener">Open</a>'+
          '</div>'+
        '</div>'+
      '</div>'
    }).join('');
    $('#sl-list').innerHTML=summary+rows;
  }).catch(function(e){toast(e.message,1);$('#sl-list').innerHTML=''}).then(function(){b.disabled=false});
};

$('#sl-list').onclick=function(e){
  var ed=e.target.closest('[data-edit-sale]');
  if(ed){
    var invName=ed.dataset.editSale;
    if(!confirm('Edit sale invoice '+invName+'? This will load the bill so you can make adjustments. The original invoice stays active until you complete the sale.')) return;
    toast('Loading sale...');
    call('ph_amend',{doctype:'Sales Invoice',name:invName},true).then(function(r){
      sessionStorage.setItem('edit_sale',JSON.stringify(r));
      window.location.href='/new-sale';
    }).catch(function(err){toast(err.message,1)});
  }
};

function form(p){
  var gst=[0,5,12,18,28].map(function(g){return '<option'+(g===5?' selected':'')+' value="'+g+'">'+g+'%</option>'}).join('');
  return '<div class="g2"><div><label for="'+p+'-bno">Batch no</label><input id="'+p+'-bno" autocomplete="off"></div>'+
  '<div><label for="'+p+'-exp">Batch expiry (month/year)</label><input id="'+p+'-exp" type="month"></div></div>'+
  '<div class="g2"><div><label for="'+p+'-hsn">HSN code</label><input id="'+p+'-hsn" inputmode="numeric" value="3004"></div>'+
  '<div><label for="'+p+'-gst">Batch GST rate</label><select id="'+p+'-gst">'+gst+'</select></div></div>'+
  '<label for="'+p+'-mrp">MRP including GST</label><input id="'+p+'-mrp" type="number" step="any" inputmode="decimal">'+
  '<label for="'+p+'-rate">Purchase rate</label><div class="g2"><input id="'+p+'-rate" type="number" step="any" inputmode="decimal">'+
  '<select id="'+p+'-basis" aria-label="Rate basis"><option value="excl">Excluding GST</option><option value="incl">Including GST</option></select></div>'+
  '<div class="g2"><div><label for="'+p+'-upp">Unit per pack</label><input id="'+p+'-upp" type="number" min="1" inputmode="numeric" value="1"></div>'+
  '<p class="hint" style="align-self:end">For a 10 tablet strip, units per pack is 10</p></div>'+
  '<div class="g2"><div><label for="'+p+'-packs">Number of packs</label><input id="'+p+'-packs" type="number" min="0" inputmode="numeric"></div>'+
  '<div><label for="'+p+'-units">Loose units if any</label><input id="'+p+'-units" type="number" min="0" inputmode="numeric" value="0"></div></div>'+
  '<div class="sum" style="margin-top:8px"><span>Your margin <b id="'+p+'-mg">0.00%</b></span><span>Amount <b id="'+p+'-am">\u20B90.00</b></span></div>';
}

function g(p,k){return $('#'+p+'-'+k)}
function read(p){
  var m=g(p,'exp').value,exp='';
  if(m){var y=+m.slice(0,4),mo=+m.slice(5,7);exp=y+'-'+String(mo).padStart(2,'0')+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}
  var gstEl=g(p,'gst');
  var gstVal=(gstEl&&gstEl.value)?gstEl.value:'5';
  return {batch:g(p,'bno').value.trim(),expiry:exp,hsn:(g(p,'hsn').value||'3004').trim(),gst:gstVal,mrp:g(p,'mrp').value,
  rate:g(p,'rate').value,basis:g(p,'basis').value,upp:g(p,'upp').value||'1',packs:g(p,'packs').value||'0',
  units:g(p,'units').value||'0',disc:'0'}
}

function calc(p){
  var d=read(p),gst=n(d.gst),excl=d.basis==='incl'?n(d.rate)/(1+gst/100):n(d.rate);
  var net=excl,mrpx=n(d.mrp)/(1+gst/100),upp=Math.max(1,n(d.upp));
  var mg=mrpx>0?(mrpx-net)/mrpx*100:0,amt=(n(d.packs)+n(d.units)/upp)*net;
  g(p,'mg').textContent=mg.toFixed(2)+'%';g(p,'am').textContent=inr(amt);
  return {net:net,amt:amt,gst:gst}
}

$('#f-ed').innerHTML=form('ed');g('ed','bno').readOnly=true;
$('#f-ed').oninput=$('#f-ed').onchange=function(){calc('ed')};

function expState(d){
  if(!d)return {k:'',t:''};
  var days=Math.floor((new Date(d+'T23:59:59')-new Date())/86400000);
  if(days<0)return {k:'expired',t:'Expired'};
  if(days<=90)return {k:'soon',t:'Expires soon'};
  return {k:'',t:''}
}

function loadList(){
  var f=$('#ls-f').value;
  call('ph_stock_list',{q:$('#ls-q').value.trim(),warehouse:wh,zero:'1'}).then(function(r){
    ls.rows=r.batches||[];renderList()
  }).catch(function(e){toast(e.message,1)})
}

function renderList(){
  var f=$('#ls-f').value,s=$('#ls-s').value;
  var rows=ls.rows.filter(function(b){var st=expState(b.expiry).k;
    if(f==='stock')return b.qty>0;
    if(f==='soon')return b.qty>0&&st==='soon';
    if(f==='expired')return b.qty>0&&st==='expired';
    if(f==='zero')return b.qty<=0;
    return true
  });
  var map={},gs=[],val=0;
  rows.forEach(function(b){
    var gp=map[b.item];if(!gp){gp={item:b.item,name:b.name,qty:0,pk:0,un:0,exp:'',batches:[]};map[b.item]=gp;gs.push(gp)}
    var u=b.upp||1,pp=Math.floor(b.qty/u+1e-9);gp.batches.push(b);gp.qty+=b.qty;gp.pk+=pp;gp.un+=Math.round(b.qty-pp*u);
    if(b.expiry&&(!gp.exp||b.expiry<gp.exp))gp.exp=b.expiry;
    val+=b.qty/(b.upp||1)*(b.net_rate||0)
  });
  gs.sort(function(a,b){
    if(s==='exp')return (a.exp||'9999').localeCompare(b.exp||'9999');
    if(s==='qty')return a.qty-b.qty;
    return (a.name||'').localeCompare(b.name||'')
  });
  $('#ls-sum').textContent=gs.length+' product(s), '+rows.length+' batch(es). Total stock value at cost: '+inr(val)+(ls.rows.length>=500?'. Showing first 500 batches; search to narrow down.':'');
  $('#ls-rows').innerHTML=gs.length?gs.map(function(gp){
    var open=ls.open===gp.item,st=expState(gp.exp);
    var h='<div class="pg"><button type="button" class="res" data-p="'+esc(gp.item)+'" aria-expanded="'+open+'"><span><strong>'+esc(gp.name)+'</strong>'+
      (gp.qty<=0?'<span class="bt out">Out of stock</span>':(st.k?'<span class="bt '+(st.k==='expired'?'out':'warn')+'">'+st.t+'</span>':''))+
      '<br><span class="mute">'+gp.batches.filter(function(x){return x.batch}).length+' batch(es)'+(gp.exp?', earliest exp '+mmyy(gp.exp):', no stock')+'</span></span><span class="r"><b>'+gp.pk+'</b> Pack'+(gp.pk===1?'':'s')+', <b>'+gp.un+'</b> Unit'+(gp.un===1?'':'s')+'</span></button>';
    if(open){
      h+='<div class="bp"><div class="split" style="align-items:center;padding-top:4px;padding-bottom:6px"><span class="mute">Available batches</span><button type="button" class="link dg" data-'+(gp.batches[0].batch?'delall':'delitem')+'="'+esc(gp.item)+'" data-nm="'+esc(gp.name)+'">'+(gp.batches[0].batch?'Delete entire stock':'Delete item')+'</button></div>'+
      gp.batches.map(function(b){
        if(!b.batch) return '<div class="sr"><span class="mute">Out of stock. No batches yet.</span><a class="btn sm go" style="text-decoration:none" href="/add-stock">Add stock</a></div>';
        var bs=expState(b.expiry);
        return '<div class="sr"><div><b>'+esc(b.batch)+'</b>'+(bs.k?'<span class="bt '+(bs.k==='expired'?'out':'warn')+'">'+bs.t+'</span>':'')+
          '<br><span class="mute">Exp '+mmyy(b.expiry)+', '+qtyText(b.qty,b.upp)+'</span><br><span class="mute">MRP '+inr(b.mrp)+', '+b.upp+' per pack</span></div>'+
          '<div class="acts"><button type="button" class="btn" data-b="'+esc(b.batch)+'">Edit</button><button type="button" class="link dg" data-del="'+esc(b.batch)+'">Delete</button></div></div>'
      }).join('')+'</div>'
    }
    return h+'</div>'
  }).join(''):'<p class="hint">No products matching current filter.</p>'
}

$('#ls-q').oninput=debounce(loadList);
$('#ls-f').onchange=$('#ls-s').onchange=renderList;

function doDelete(payload,confirmMsg){
  if(!confirm(confirmMsg)) return;
  payload.warehouse=wh;
  call('ph_stock_delete',payload,true).then(function(r){
    toast('Removed '+r.deleted+'. Stock adjustment: '+r.document+'.');
    loadList();
  }).catch(function(e){toast(e.message,1)})
}

$('#ls-rows').onclick=function(e){
  var tg=e.target.closest('button[data-p]');
  if(tg){ls.open=ls.open===tg.dataset.p?null:tg.dataset.p;renderList();return}
  var di=e.target.closest('button[data-delitem]');
  if(di){doDelete({item:di.dataset.delitem,remove_item:'1'},'Delete the product '+di.dataset.nm+'?');return}
  var dl=e.target.closest('button[data-del]');
  if(dl){doDelete({batch:dl.dataset.del},'Delete batch '+dl.dataset.del+'? Stock will be cleared to zero.');return}
  var bt=e.target.closest('button[data-b]');if(!bt)return;
  var b=null;ls.rows.forEach(function(x){if(x.batch===bt.dataset.b)b=x});if(!b)return;
  ls.cur=b;toast('');
  $('#ls-title').textContent='Edit '+b.name;g('ed','bno').value=b.batch;
  g('ed','exp').value=(b.expiry||'').slice(0,7);
  g('ed','hsn').value=b.hsn||'3004';
  var gs=g('ed','gst'),gv=String(b.gst||5);
  if(![].some.call(gs.options,function(o){return o.value===gv}))gs.add(new Option(gv+'%',gv));
  gs.value=gv;g('ed','mrp').value=b.mrp||'';g('ed','rate').value=b.purchase_rate||'';g('ed','basis').value='excl';
  g('ed','upp').value=b.upp||1;
  var upp=b.upp||1,pk=Math.floor(b.qty/upp+1e-9);g('ed','packs').value=pk;g('ed','units').value=Math.round(b.qty-pk*upp);
  ls.total=b.qty;calc('ed');
  $('#ls-edit').hidden=false;$('#ls-edit').scrollIntoView({block:'start',behavior:'smooth'})
};

g('ed','upp').onchange=function(){
  var u=Math.max(1,Math.floor(n(this.value)));this.value=u;
  var pk=Math.floor(ls.total/u+1e-9);g('ed','packs').value=pk;g('ed','units').value=Math.round(ls.total-pk*u);calc('ed')
};

[g('ed','packs'),g('ed','units')].forEach(function(el){el.oninput=function(){
  var u=Math.max(1,n(g('ed','upp').value));ls.total=n(g('ed','packs').value)*u+n(g('ed','units').value)}
});

$('#ls-cancel').onclick=function(){$('#ls-edit').hidden=true;ls.cur=null};

$('#ls-save').onclick=function(){
  var d=read('ed'),b=this;
  if(!ls.cur||!d.expiry){toast('Enter batch expiry.',1);return}
  if(n(d.mrp)<=0||n(d.rate)<=0){toast('Enter MRP and purchase rate.',1);return}
  if(n(d.packs)<0||n(d.units)<0){toast('Quantity cannot be negative.',1);return}
  d.batch=ls.cur.batch;d.warehouse=wh;b.disabled=true;
  call('ph_stock_edit',d,true).then(function(r){
    toast('Saved batch '+r.batch+'. Stock is now '+qtyText(r.units,r.upp)+'. Adjustment: '+r.document+'.');
    $('#ls-edit').hidden=true;ls.cur=null;loadList()
  }).catch(function(e){toast(e.message,1)}).then(function(){b.disabled=false})
};

calc('ed');
})();
</script>
</div>
